    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CertificateRotation is the mechanism for initiating an RKE2 or K3s certificate rotation
          operation for provisioned and imported clusters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the CertificateRotation.
            properties:
              args:
                description: Args contains parameters for certificate rotation.
                properties:
                  services:
                    description: |-
                      Services is a list of services to rotate certificates for.
                      If empty, all supported services are rotated.
                    items:
                      enum:
                      - admin
                      - api-server
                      - auth-proxy
                      - cloud-controller
                      - controller-manager
                      - etcd
                      - k3s-controller
                      - k3s-server
                      - kubelet
                      - kube-proxy
                      - rke2-controller
                      - rke2-server
                      - scheduler
                      - supervisor
                      type: string
                    nullable: true
                    type: array
                type: object
              cancel:
                default: false
                description: |-
                  Cancel requests the operation to stop permanently. Unlike Paused, it is terminal and cannot be unset.
                  Recover by deleting and recreating the operation.
                  Paused takes precedence: a paused operation halts reconciliation entirely, so the cancellation
                  is only observed once the pause is lifted.
                  Cancelling an operation which has already reached a terminal phase does nothing: there is no
                  work left to call off, so the phase it ended in stands and the Canceled condition reports that
                  the request was declined. Deleting such an operation does still stop it, which is the remedy
                  for one whose terminal phase hook is never answered.
                  Setting it on an operation already in a terminal phase is rejected outright, by a validation
                  rule which has to live on each operation type rather than here: a rule on this field only sees
                  the field, and deciding whether a cancellation can still take effect needs status.phase. The
                  rule cannot close the race where an operation reaches a terminal phase between the request
                  being admitted and the controller acting on it, which is why the controller declines it too.
                type: boolean
                x-kubernetes-validations:
                - message: cancel cannot be unset once true
                  rule: self || !oldSelf
              clusterRef:
