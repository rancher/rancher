name: "Build Rancher Server"
description: "Build and upload the Rancher server image"
runs:
  using: "composite"
  steps:
    - name: Arch environment variable
      shell: bash
      run: |
        if [[ "$ARCH" == "x64" ]]; then
          echo "ARCH=amd64" >> $GITHUB_ENV
        fi
    - name: Setup Environment Variables
      uses: ./.github/actions/setup-tag-env
    - id: env 
      name: Setup Dependencies Env Variables
      uses: ./.github/actions/setup-build-env
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ github.repository_owner }}/rancher
        flavor: |
          latest=false
    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
    - name: Set up Docker Buildx
      id: setup-buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    # Cache key is scoped to the PR's target branch (github.base_ref), not
    # go.mod/go.sum content, so a dependency bump only grows the cache on the
    # next write instead of causing a full miss for every PR against that
    # branch. On a non-PR run (push to main/release branch), github.base_ref
    # is empty, so fall back to github.ref_name (the branch being pushed to).
    # restore-keys still gives content-hash-tolerant graceful degradation:
    # if this exact branch+hash was never cached, fall back to the latest
    # cache for the branch regardless of go.mod/go.sum state.
    - name: Compute cache scope
      id: cache-scope
      shell: bash
      run: |
        BRANCH="${{ github.base_ref || github.ref_name }}"
        SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
        echo "branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
    - name: Restore go build/mod cache
      id: cache
      uses: actions/cache@v4
      with:
        path: go-build-cache-server-${{ env.ARCH }}
        key: rancher-gocache-server-${{ env.ARCH }}-${{ steps.cache-scope.outputs.branch }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          rancher-gocache-server-${{ env.ARCH }}-${{ steps.cache-scope.outputs.branch }}-
    - name: Inject go build/mod cache into BuildKit
      uses: reproducible-containers/buildkit-cache-dance@v3
      with:
        builder: ${{ steps.setup-buildx.outputs.name }}
        cache-map: |
          {
            "go-build-cache-server-${{ env.ARCH }}": { "target": "/root/.cache", "id": "rancher" }
          }
        # Only write the cache back on a push to a real branch (post-merge),
        # never from a PR build -- PRs should only ever read the target
        # branch's cache, never pollute it with PR-specific/unmerged state.
        skip-extraction: ${{ github.event_name == 'pull_request' }}
    - name: Build and export server
      id: build
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        push: false
        build-args: |
          "VERSION=${{ env.TAG }}"
          "COMMIT=${{ env.COMMIT }}"
          "ARCH=${{ env.ARCH }}"
          "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}"
          "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}"
          "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}"
          "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}"
          "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}"
        tags: ${{ github.repository_owner }}/rancher:${{ env.TAG }}-${{ env.ARCH }}
        context: .
        platforms: "${{ env.OS }}/${{ env.ARCH }}"
        file: ./package/Dockerfile
        labels: "${{ steps.meta.outputs.labels }}"
        outputs: type=docker,dest=/tmp/rancher-${{ env.OS }}-${{ env.ARCH }}.tar
        target: "server"
    - name: Upload image
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: "rancher-${{ env.OS }}-${{ env.ARCH }}"
        path: /tmp/rancher-${{ env.OS }}-${{ env.ARCH }}.tar
        if-no-files-found: error
        retention-days: 4
        overwrite: false
