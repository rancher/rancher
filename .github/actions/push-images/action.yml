name: "Push Rancher images"
description: "Download Rancher image files and push them to a registry"
runs:
  using: "composite"
  steps:
    - name: Environment variables
      shell: bash
      run: |
        if [[ "$ARCH" == "x64" ]]; then
          echo "ARCH=amd64" >> $GITHUB_ENV
        fi
    - name: Download rancher image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: "*-${{ env.OS }}-${{ env.ARCH }}"
        path: /tmp
        merge-multiple: true
    - name: Setup Environment Variables
      uses: ./.github/actions/setup-tag-env
    - name: Docker Registry Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}
        registry: ${{ env.REGISTRY }}
    - name: Push server image
      shell: bash
      run: |
        image_id=$(docker load --input "/tmp/rancher-${OS}-${ARCH}.tar" 2>&1 | grep "Loaded image" | awk '{print $NF}')
        if [ -z "$image_id" ]; then
          echo "Error: Failed to load image from tarball!"
          exit 1
        fi
        docker tag "$image_id" "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/rancher:${TAG}-${ARCH}"
        docker push "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/rancher:${TAG}-${ARCH}"
    - name: Push agent image
      shell: bash
      run: |
        image_agent_id=$(docker load --input "/tmp/rancher-agent-${OS}-${ARCH}.tar" 2>&1 | grep "Loaded image" | awk '{print $NF}')
        if [ -z "$image_agent_id" ]; then
          echo "Error: Failed to load image from tarball!"
          exit 1
        fi
        docker tag "$image_agent_id" "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/rancher-agent:${TAG}-${ARCH}"
        docker push "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/rancher-agent:${TAG}-${ARCH}"
