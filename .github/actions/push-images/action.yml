name: "Push Rancher images"
description: "Download Rancher image files and push them to a registry"
runs:
  using: "composite"
  steps:
    - name: Environment variables
      shell: bash
      run: |
        if [[ "$ARCH" == "x64" ]]; then
          echo "ARCH=amd64" >> $GITHUB_ENV
        fi
    - name: Download rancher image
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: "rancher-*-${{ env.OS }}-${{ env.ARCH }}"
        path: /tmp
        merge-multiple: true
    - name: Setup Environment Variables
      uses: $/.github/actions/setup-tag-env
    - name: Docker Registry Login
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}
        registry: ${{ env.REGISTRY }}
    - name: Push server image
      shell: bash
      run: |
        image_id=$(docker load --input "/tmp/rancher-server-${OS}-${ARCH}.tar" 2>&1 | grep "Loaded image" | awk '{print $NF}')
        if [ -z "$image_id" ]; then
          echo "Error: Failed to load image from tarball!"
          exit 1
        fi
        docker tag "$image_id" "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/rancher-server:${TAG}-${ARCH}"
        docker push "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/rancher-server:${TAG}-${ARCH}"
    - name: Push agent image
      shell: bash
      run: |
        image_agent_id=$(docker load --input "/tmp/rancher-agent-${OS}-${ARCH}.tar" 2>&1 | grep "Loaded image" | awk '{print $NF}')
        if [ -z "$image_agent_id" ]; then
          echo "Error: Failed to load image from tarball!"
          exit 1
        fi
        docker tag "$image_agent_id" "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/rancher-agent:${TAG}-${ARCH}"
        docker push "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/rancher-agent:${TAG}-${ARCH}"
    - name: Push demo image
      shell: bash
      run: |
        image_demo_id=$(docker load --input "/tmp/rancher-demo-${OS}-${ARCH}.tar" 2>&1 | grep "Loaded image" | awk '{print $NF}')
        if [ -z "$image_demo_id" ]; then
          echo "Error: Failed to load image from tarball!"
          exit 1
        fi
        docker tag "$image_demo_id" "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/rancher:${TAG}-${ARCH}"
        docker push "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/rancher:${TAG}-${ARCH}"
