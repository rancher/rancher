name: "Publish chart to gcp"
description: "Build index and upload chart to gcp"
inputs:
  chart_repo:
    description: "Value of CHART_REPO variable at build time"
    required: true
  chart_filename:
    description: "Original rancher chart filename, including version"
    required: true
runs:
  using: "composite"
  steps:
    - name: Download rancher chart
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: "rancher-chart"
        path: /tmp
    - name: Prepare for upload
      shell: bash
      env:
        CHART_REPO: ${{ inputs.chart_repo }}
        CHART_FILENAME: ${{ inputs.chart_filename }}
      run: |
        mkdir -p "bin/chart/${CHART_REPO}"
        cp /tmp/rancher-chart.tgz "bin/chart/${CHART_REPO}/${CHART_FILENAME}"
    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        credentials_json: ${{ env.GOOGLE_AUTH }}
    - name: Upload
      uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
      with:
        destination: releases.rancher.com/server-charts
        path: ./bin/chart
        parent: false
        process_gcloudignore: false
        predefinedAcl: publicRead
        headers: |-
          cache-control: public,no-cache,proxy-revalidate
