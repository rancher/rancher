name: Create CI Testing PR
on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch for the PR (leave empty for default branch)'
        required: false
        default: ''
      max_ci_attempts:
        description: 'Maximum number of CI attempts per workflow'
        required: false
        default: 20
        type: number
      include_patterns:
        description: 'Patterns to include in failure detection (URL encode special chars: %2C for comma, %27 for single quote)'
        required: false
        default: 'FAIL,Fail,failed,ERROR:,Error:,error:,##[error],Error Trace:'
      exclude_patterns:
        description: 'Patterns to exclude from failure detection (URL encode special chars: %2C for comma, %27 for single quote)'
        required: false
        default: 'Failed to save: Unable to reserve cache with key docker.io,Failed to restore: "/usr/bin/tar" failed with error: The process,echo "Error: Failed to load image from tarball!",H4sIAAAAAAAA'
      provisioning_test_scope:
        description: 'The desired scope (basic, operations, prebootstrap, imported, full) that should be run when executing the provisioning tests. An empty value is interpreted as "full".'
        required: false
        default: 'full'
permissions:
  contents: write
  pull-requests: write
  id-token: write # Vault access

jobs:
  create-test-pr:
    runs-on: ubuntu-latest
    steps:
      - name: "Read some Secrets"
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/pr-actions-write-app/credentials appId | APP_ID;
            secret/data/github/repo/${{ github.repository }}/github/pr-actions-write-app/credentials privateKey | PRIVATE_KEY

      - name: "Create temporary token"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Clear sensitive variables
        run: |
          echo "PRIVATE_KEY=" >> $GITHUB_ENV
          echo "APP_ID=" >> $GITHUB_ENV

      - name: Checkout repository
        # zizmor: ignore[artipacked] -- this job must retain checkout credentials for authenticated branch fetch and push operations.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup and create branch
        id: branch-setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH_INPUT: ${{ inputs.base_branch }}
        run: |
          if [[ -n "$BASE_BRANCH_INPUT" ]]; then
            BASE_BRANCH="$BASE_BRANCH_INPUT"
          else
            BASE_BRANCH=$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name')
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin "$BASE_BRANCH"
          git checkout "$BASE_BRANCH"

          BRANCH_NAME="ci_testing_$(date +'%Y%m%d_%H%M%S')"
          git checkout -b "$BRANCH_NAME"

          echo "base_branch=$BASE_BRANCH" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create and push empty commit
        id: push
        env:
          BRANCH: ${{ steps.branch-setup.outputs.branch }}
          PROVISIONING_TEST_SCOPE: ${{ inputs.provisioning_test_scope }}
          SCOPES_CONFIG: .github/scripts/provisioning-test-scopes.yaml
        run: |
          # identify the correct trigger file to create based on the requested provisioning scope
          scope="${PROVISIONING_TEST_SCOPE:-full}"
          [ "$scope" = "full" ] && paths_expr='.full' || paths_expr=".scopes.$scope.file-paths"
          trigger_file="trigger-${scope}-ci"
          expected_trigger_path="^${trigger_file}$"
          if ! yq -r "${paths_expr}[] | (.path // .)" "$SCOPES_CONFIG" | grep -Fxq -- "$expected_trigger_path"; then
            echo "Invalid or misconfigured scope '$scope' (no '$expected_trigger_path' entry in $SCOPES_CONFIG). Valid scopes: $(yq -r '.scopes | keys | join(" ")' "$SCOPES_CONFIG") full" >&2
            exit 1
          fi
          
          echo "provisioning_tests_scope=$scope" >> $GITHUB_OUTPUT

          touch "$trigger_file"
          git add "$trigger_file"
          git commit -m "Add ${trigger_file} file for CI testing"
          git push origin "$BRANCH"

      - name: Create draft PR
        env:
          # Needs write permissions to Pull requests (CI does not trigger on prs created by GITHUB_TOKEN)
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INCLUDE_PATTERNS: ${{ inputs.include_patterns }}
          EXCLUDE_PATTERNS: ${{ inputs.exclude_patterns }}
          MAX_ATTEMPTS: ${{ inputs.max_ci_attempts }}
          BASE_BRANCH: ${{ steps.branch-setup.outputs.base_branch }}
          BRANCH: ${{ steps.branch-setup.outputs.branch }}
          PROVISIONING_TESTS_SCOPE: ${{ steps.push.outputs.provisioning_tests_scope }}
        run: |
          echo "This PR is for CI testing purposes only and can be ignored." > pr_body.txt
          echo "" >> pr_body.txt
          echo "MAX_CI_ATTEMPTS: \`$MAX_ATTEMPTS\`" >> pr_body.txt
          echo "PROVISIONING_TESTS_SCOPE: \`$PROVISIONING_TEST_SCOPE\`" >> pr_body.txt

          if [[ -n "$INCLUDE_PATTERNS" ]]; then
            echo "INCLUDE_PATTERNS: \`$INCLUDE_PATTERNS\`" >> pr_body.txt
          fi

          if [[ -n "$EXCLUDE_PATTERNS" ]]; then
            echo "EXCLUDE_PATTERNS: \`$EXCLUDE_PATTERNS\`" >> pr_body.txt
          fi

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "CI Testing" \
            --body-file pr_body.txt \
            --draft
