name: Controller Integration Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - 'release/*'

permissions:
  contents: read
  id-token: none

env:
  GOARCH: amd64
  CGO_ENABLED: 0
  SETUP_GO_VERSION: '1.26.*'

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.SETUP_GO_VERSION }}
          cache: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }} # zizmor: ignore[cache-poisoning] -- test-only dependency cache; release workflows are separate.
      - name: Run Integration Tests
        env:
          ENVTEST_K8S_VERSION: "1.30"
        run: ./tests/controllers/run_controller_tests.sh
