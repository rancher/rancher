name: Provisioning tests
on:
  workflow_call:
permissions: {}
jobs:
  # setup-matrix dynamically builds the test matrix from the change set using the
  # precompiled scopes list (.github/scripts/provisioning-test-scopes.yaml).
  # On pull_request only the scopes with changed paths run.
  # Every other event runs the full matrix
  setup-matrix:
    name: Build Test Matrix
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.26@sha256:a491bffcf6fce8e242fa2a64df51375f2d0400ddbfb7a6649365f808eb11abca # go1.26
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      run: ${{ steps.build.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build matrix
        id: build
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eo pipefail

          # On a PR, diff against the base (target) SHA 
          if [ "$EVENT_NAME" = "pull_request" ]; then
            export DIFF_BASE="$BASE_SHA"
          else
            export ALL=1
          fi

          MATRIX="$(bash .github/scripts/resolve-provisioning-matrix.sh)"

          # Expect compact {"include":[...]} JSON on a single line, bail otherwise.
          if ! echo "$MATRIX" | jq -e 'has("include") and (.include | type == "array")' >/dev/null; then
            echo "error: unexpected matrix output: $MATRIX" >&2
            exit 1
          fi

          # If the returned matrix is empty, the test job below is skipped outright.
          COUNT="$(echo "$MATRIX" | jq '.include | length')"

          # Sanity cap against accidental fan-out
          if [ "$COUNT" -gt 16 ]; then
            echo "error: too many matrix entries ($COUNT)" >&2
            exit 1
          fi

          if [ "$COUNT" -gt 0 ]; then RUN=true; else RUN=false; fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

          echo "event=$EVENT_NAME, entries=$COUNT, run=$RUN"
          echo "$MATRIX" | jq .

  provisioning_tests:
    needs: [setup-matrix]
    if: ${{ needs.setup-matrix.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    name: Provisioning tests
    runs-on:
      - runs-on
      - spot=false
      - runner=${{ matrix.V2PROV_TEST_CPUS }}cpu-linux-x64
      - run-id=${{ github.run_id }}
    env:
      # The registry-cache pod exposes a host port, so use the Docker bridge IP from the runner.
      REGISTRY: "172.17.0.2:5000"
      DRONE_BUILD_EVENT: "${{ github.event_name }}"
      V2PROV_TEST_RUN_REGEX: "${{ matrix.V2PROV_TEST_RUN_REGEX }}"
      V2PROV_TEST_DIST: "${{ matrix.V2PROV_TEST_DIST }}"
      CATTLE_FEATURES: "${{ matrix.CATTLE_FEATURES }}"
      TAG: ${{ github.sha }}-head
      COMMIT: ${{ github.sha }}
      IMAGE: ${{ github.repository_owner }}/rancher
      IMAGE_AGENT: ${{ github.repository_owner }}/rancher-agent
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: testdata
        run: mkdir -p build/testdata
      - name: Configure Docker for cgroupfs/insecure-registry
        run: |
          echo '{"exec-opts": ["native.cgroupdriver=cgroupfs"], "insecure-registries": ["172.17.0.2:5000"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sudo docker info
      - name: Download Docker images artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: "/tmp"
          merge-multiple: true
      - name: Load rancher/rancher image
        run: |
          image_id=$(docker load --input /tmp/rancher-linux-amd64.tar 2>&1 | grep "Loaded image" | awk '{print $NF}')
          if [ -z "$image_id" ]; then
            echo "Error: Failed to load image from tarball!"
            exit 1
          fi

          AMD_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "rancher/rancher:.*amd64.*$" | head -n 1)
          docker tag "$image_id" "${IMAGE}:${TAG}"
          echo "the image created is ${IMAGE}:${TAG}"
      - name: Load rancher/rancher-agent image
        run: |
          image_agent_id=$(docker load --input /tmp/rancher-agent-linux-amd64.tar 2>&1 | grep "Loaded image" | awk '{print $NF}')
          if [ -z "$image_agent_id" ]; then
            echo "Error: Failed to load image from tarball!"
            exit 1
          fi

          AMD_IMAGE_AGENT=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "rancher/rancher-agent:.*amd64.*$" | head -n 1)
          docker tag "$image_agent_id" "${REGISTRY}/${IMAGE_AGENT}:${TAG}"
          echo "the image created is ${REGISTRY}/${IMAGE_AGENT}:${TAG}"
      - name: Run tests
        env:
          CATTLE_AGENT_IMAGE: "${{ env.IMAGE_AGENT}}:${{ env.TAG }}"
        run: |
          set -eo pipefail
          ./scripts/container-run provisioning-tests | tee provtest_output.txt
      - name: Move plaintext test results for upload
        if: always()
        id: test_output
        run: |
          export TESTSUITE="$(echo "${V2PROV_TEST_RUN_REGEX}" | sed 's/Test//' | tr -d '()|_^.*$')"
          echo "suite=${TESTSUITE}" >> $GITHUB_OUTPUT
          mv ./build/out.txt "/tmp/report-${V2PROV_TEST_DIST}-${TESTSUITE}.txt"
      - name: Upload Plain Text Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "Test Results ${{ matrix.V2PROV_TEST_DIST }} ${{ steps.test_output.outputs.suite }}"
          path: "/tmp/report-${{ matrix.V2PROV_TEST_DIST }}-${{ steps.test_output.outputs.suite }}.*"
      - name: Upload logdump artifact if we had some tests failures
        if: failure()
        uses: rancherlabs/cowboy@61de86d99456805424f9af0dadfcf362413cd745
        with:
          log-file-path: provtest_output.txt
          artifact-retention-days: 7
          artifact-name: "Parsed Failure Log Dump (${{ matrix.V2PROV_TEST_DIST }}, ${{ steps.test_output.outputs.suite }})"

  # provisioning_tests_summary prints a friendly summary of what tests ran. It's true purpose
  # is to act as an anchor, giving us a single check that forwards the results of the dynamic matrix
  # which we can use as a 'required check'
  provisioning_tests_summary:
    if: always()
    name: Provisioning Tests Summary
    needs: [setup-matrix, provisioning_tests]
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.26@sha256:a491bffcf6fce8e242fa2a64df51375f2d0400ddbfb7a6649365f808eb11abca # go1.26
    steps:
      - name: Generate provisioning tests summary
        run: |
          echo "Provisioning Test Summary"
          echo "--------------------------------"        
          if [[ "${{ needs.setup-matrix.result }}" != "success" && "${{ needs.setup-matrix.result }}" != "skipped" ]]; then
            echo "Failed to setup test matrix."
            exit 1
          fi
          
          if [[ "${{ needs.provisioning_tests.result }}" != "success" && "${{ needs.provisioning_tests.result }}" != "skipped" ]]; then
            echo "Some provisioning tests failed. Please check the logs for details."
            exit 1
          fi

  convert-to-xml:
    name: Convert test report to xml
    needs: [provisioning_tests]
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.26@sha256:8a85de7228e1b3bd7e29e7797b98dc0c24e82effc1d8a12d24a14462f4d13324 # go1.26
    steps:
      - name: Fetch plaintext test output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: /tmp/test-results/
      - name: Convert test results to XML
        run: |
          for file in $(ls /tmp/test-results/report-*.txt); do
             echo "Processing $file..."
             go run github.com/jstemmer/go-junit-report/v2@14d61e6e75e3f3c74551d757ad936e8e88014464 < $file > $(sed 's/txt/xml/g' <<<$file)
          done
      - name: Upload XML Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XML Results
          path: "/tmp/test-results/report-*.xml"

  event-file:
    name: Upload event file
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.26@sha256:8a85de7228e1b3bd7e29e7797b98dc0c24e82effc1d8a12d24a14462f4d13324 # go1.26
    steps:
      - name: Upload GH Event File
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Event File
          path: ${{ github.event_path }}
