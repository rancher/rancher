name: Port issue
run-name: "Port issue ${{ github.event.issue.number }}: ${{ github.event.issue.title }}"

on:
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  port-issue:
    runs-on: ubuntu-latest
    if: startsWith(github.event.comment.body, '/backport') || startsWith(github.event.comment.body, '/forwardport')
    steps:
      - name: Check org membership
        id: membership
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          if gh api orgs/${GITHUB_REPOSITORY_OWNER}/members --paginate | jq -e --arg GITHUB_ACTOR "$GITHUB_ACTOR" '.[] | select(.login == $GITHUB_ACTOR)' > /dev/null; then
              echo "${GITHUB_ACTOR} is a member"
              echo "is_member=true" >> $GITHUB_OUTPUT
          else
              echo "${GITHUB_ACTOR} is not a member of ${GITHUB_REPOSITORY_OWNER}" >> $GITHUB_STEP_SUMMARY
              echo "is_member=false" >> $GITHUB_OUTPUT
          fi
      - name: Check milestone
        if: steps.membership.outputs.is_member == 'true'
        id: milestone
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ORIGINAL_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          BODY_MILESTONE=$(echo "${COMMENT_BODY}" | awk '{ print $2 }')
          # Sanitize input
          MILESTONE=${BODY_MILESTONE//[^a-zA-Z0-9\-\.]/}
          if gh api repos/${GITHUB_REPOSITORY}/milestones --paginate | jq -e --arg MILESTONE "$MILESTONE" '.[] | select(.title == $MILESTONE)' > /dev/null; then
              echo "Milestone exists"
              echo "milestone_exists=true" >> $GITHUB_OUTPUT
           else
              echo "Milestone ${MILESTONE} does not exist" >> $GITHUB_STEP_SUMMARY
              gh issue comment -R ${GITHUB_REPOSITORY} ${ORIGINAL_ISSUE_NUMBER} --body "Not creating port issue, milestone ${MILESTONE} does not exist or is not an open milestone"
              echo "milestone_exists=false" >> $GITHUB_OUTPUT
           fi
      - name: Port issue
        if: |
          steps.membership.outputs.is_member == 'true' &&
          steps.milestone.outputs.milestone_exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ORIGINAL_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          declare -a additional_cmd
          BODY=$(mktemp)
          ORIGINAL_ISSUE=$(gh issue view -R ${GITHUB_REPOSITORY} ${ORIGINAL_ISSUE_NUMBER} --json title,body,assignees,issueType)
          ORIGINAL_TITLE=$(echo "${ORIGINAL_ISSUE}" | jq -r .title)
          ORIGINAL_TYPE=$(echo "${ORIGINAL_ISSUE}" | jq -r '.issueType.name // empty')
          if [ -n "$ORIGINAL_TYPE" ]; then
              additional_cmd+=("--type")
              additional_cmd+=("${ORIGINAL_TYPE}")
          fi
          TYPE=$(echo "${COMMENT_BODY}" | awk '{ print $1 }' | sed -e 's_/__')
          MILESTONE=$(echo "${COMMENT_BODY}" | awk '{ print $2 }')
          NEW_TITLE="[${TYPE}] ${ORIGINAL_TITLE}"
          # rancher/rancher title
          if [[ $MILESTONE =~ (v[0-9]\.[0-9]+) ]]; then
              NEW_TITLE="[${TYPE} ${BASH_REMATCH[1]}] ${ORIGINAL_TITLE}"
          fi
          # rancher/rke2 title
          # MAJOR_MINOR_MILESTONE=$(echo $MILESTONE | cut -d. -f1,2)
          # NEW_TITLE="[${TYPE} release-${MAJOR_MINOR_MILESTONE}] ${ORIGINAL_TITLE}"
          ORIGINAL_LABELS=$(gh issue view -R ${GITHUB_REPOSITORY} ${ORIGINAL_ISSUE_NUMBER} --json labels --jq '.labels[].name' | grep -v '^\[zube\]:' | paste -sd "," -)
          if [ -n "$ORIGINAL_LABELS" ]; then
              additional_cmd+=("--label")
              additional_cmd+=("${ORIGINAL_LABELS}")
          fi
          ORIGINAL_PROJECT=$(gh issue view -R ${GITHUB_REPOSITORY} ${ORIGINAL_ISSUE_NUMBER} --json projectItems --jq '.projectItems[].title')
          if [ -n "$ORIGINAL_PROJECT" ]; then
              additional_cmd+=("--project")
              additional_cmd+=("${ORIGINAL_PROJECT}")
          fi
          ASSIGNEES=$(echo "${ORIGINAL_ISSUE}" | jq -r .assignees[].login)
          if [ -n "$ASSIGNEES" ]; then
              echo "Checking if assignee is member before assigning"
              # Fetch organization members once to reduce API calls
              ORG_MEMBERS=$(gh api orgs/${GITHUB_REPOSITORY_OWNER}/members --paginate | jq -r '.[].login')
              DELIMITER=""
              NEW_ASSIGNEES=""
              for ASSIGNEE in $ASSIGNEES; do
                  # Exclude Copilot assignees (copilot, copilot-swe-agent, etc.)
                  if [[ "${ASSIGNEE,,}" =~ ^copilot(-.+)?$ ]]; then
                      echo "Skipping Copilot assignee: ${ASSIGNEE}"
                      continue
                  fi
                  if echo "$ORG_MEMBERS" | grep -Fqx "$ASSIGNEE"; then
                      echo "${ASSIGNEE} is a member, adding to assignees"
                      NEW_ASSIGNEES="${NEW_ASSIGNEES}${DELIMITER}${ASSIGNEE}"
                      DELIMITER=","
                  fi
              done
              if [ -n "$NEW_ASSIGNEES" ]; then
                  echo "Assignees for new issue: ${NEW_ASSIGNEES}"
                  additional_cmd+=("--assignee")
                  additional_cmd+=("${NEW_ASSIGNEES}")
              fi
          fi
          if [ -n "$MILESTONE" ]; then
              echo -e "This is a ${TYPE} issue for #${ORIGINAL_ISSUE_NUMBER}, automatically created via [GitHub Actions workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) initiated by @${GITHUB_ACTOR}\n" > $BODY
              echo -e "\nOriginal issue body:\n" >> $BODY
              echo "${ORIGINAL_ISSUE}" | jq -r '.body[0:65536]' >> $BODY
              NEW_ISSUE=$(gh issue create -R "${GITHUB_REPOSITORY}" --title "${NEW_TITLE}" --body-file "${BODY}" -m "${MILESTONE}" "${additional_cmd[@]}")
              echo "Port issue created: ${NEW_ISSUE}" >> $GITHUB_STEP_SUMMARY

              # Copy Project v2 field values (e.g. Status, Priority) from the original
              # issue's project items to the newly created issue's project items.
              # The --project flag above adds the new issue to the same projects but
              # with default field values, so we replay each field value here.
              NEW_ISSUE_NUMBER=$(echo "${NEW_ISSUE}" | awk -F/ '{ print $NF }')
              REPO_OWNER="${GITHUB_REPOSITORY%/*}"
              REPO_NAME="${GITHUB_REPOSITORY#*/}"

              read -r -d '' PROJECT_ITEMS_QUERY <<'EOF' || true
          query($owner: String!, $repo: String!, $number: Int!) {
            repository(owner: $owner, name: $repo) {
              issue(number: $number) {
                projectItems(first: 100) {
                  nodes {
                    id
                    project { id }
                    fieldValues(first: 100) {
                      nodes {
                        __typename
                        ... on ProjectV2ItemFieldSingleSelectValue { field { ... on ProjectV2SingleSelectField { id } } optionId }
                        ... on ProjectV2ItemFieldNumberValue { field { ... on ProjectV2FieldCommon { id } } number }
                        ... on ProjectV2ItemFieldTextValue { field { ... on ProjectV2FieldCommon { id } } text }
                        ... on ProjectV2ItemFieldDateValue { field { ... on ProjectV2FieldCommon { id } } date }
                        ... on ProjectV2ItemFieldIterationValue { field { ... on ProjectV2FieldCommon { id } } iterationId }
                      }
                    }
                  }
                }
              }
            }
          }
          EOF

              ORIGINAL_PROJECT_ITEMS=$(gh api graphql \
                  -f query="${PROJECT_ITEMS_QUERY}" \
                  -f owner="${REPO_OWNER}" \
                  -f repo="${REPO_NAME}" \
                  -F number="${ORIGINAL_ISSUE_NUMBER}" \
                  --jq '.data.repository.issue.projectItems.nodes')

              NEW_PROJECT_ITEMS=$(gh api graphql \
                  -f query="${PROJECT_ITEMS_QUERY}" \
                  -f owner="${REPO_OWNER}" \
                  -f repo="${REPO_NAME}" \
                  -F number="${NEW_ISSUE_NUMBER}" \
                  --jq '.data.repository.issue.projectItems.nodes')

              # Build a map from project id -> new project item id so we can find
              # the matching target item for each source item.
              declare -A NEW_ITEM_BY_PROJECT=()
              while IFS=$'\t' read -r PROJECT_ID ITEM_ID; do
                  [ -z "$PROJECT_ID" ] && continue
                  NEW_ITEM_BY_PROJECT[$PROJECT_ID]=$ITEM_ID
              done < <(echo "${NEW_PROJECT_ITEMS}" | jq -r '.[] | [.project.id, .id] | @tsv')

              # For each source project item, replay every field value onto the
              # matching new project item.
              while IFS=$'\t' read -r PROJECT_ID FIELD_VALUES_JSON; do
                  [ -z "$PROJECT_ID" ] && continue
                  NEW_ITEM_ID="${NEW_ITEM_BY_PROJECT[$PROJECT_ID]:-}"
                  if [ -z "$NEW_ITEM_ID" ]; then
                      echo "No matching new project item for project ${PROJECT_ID}, skipping field copy"
                      continue
                  fi
                  echo "${FIELD_VALUES_JSON}" | jq -c '.[]' | while read -r FIELD_VALUE; do
                      TYPENAME=$(echo "${FIELD_VALUE}" | jq -r '.__typename')
                      FIELD_ID=$(echo "${FIELD_VALUE}" | jq -r '.field.id // empty')
                      if [ -z "$FIELD_ID" ]; then
                          continue
                      fi
                      case "${TYPENAME}" in
                          ProjectV2ItemFieldSingleSelectValue)
                              OPTION_ID=$(echo "${FIELD_VALUE}" | jq -r '.optionId // empty')
                              [ -z "$OPTION_ID" ] && continue
                              VALUE_ARG=(-f "value[singleSelectOptionId]=${OPTION_ID}")
                              ;;
                          ProjectV2ItemFieldNumberValue)
                              NUMBER=$(echo "${FIELD_VALUE}" | jq -r 'if has("number") and .number != null then .number else "" end')
                              [ -z "$NUMBER" ] && continue
                              VALUE_ARG=(-F "value[number]=${NUMBER}")
                              ;;
                          ProjectV2ItemFieldTextValue)
                              TEXT=$(echo "${FIELD_VALUE}" | jq -r '.text // empty')
                              [ -z "$TEXT" ] && continue
                              VALUE_ARG=(-f "value[text]=${TEXT}")
                              ;;
                          ProjectV2ItemFieldDateValue)
                              DATE=$(echo "${FIELD_VALUE}" | jq -r '.date // empty')
                              [ -z "$DATE" ] && continue
                              VALUE_ARG=(-f "value[date]=${DATE}")
                              ;;
                          ProjectV2ItemFieldIterationValue)
                              ITERATION_ID=$(echo "${FIELD_VALUE}" | jq -r '.iterationId // empty')
                              [ -z "$ITERATION_ID" ] && continue
                              VALUE_ARG=(-f "value[iterationId]=${ITERATION_ID}")
                              ;;
                          *)
                              continue
                              ;;
                      esac
                      gh api graphql \
                          -f query='mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                            updateProjectV2ItemFieldValue(input: {projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: $value}) {
                              projectV2Item { id }
                            }
                          }' \
                          -f projectId="${PROJECT_ID}" \
                          -f itemId="${NEW_ITEM_ID}" \
                          -f fieldId="${FIELD_ID}" \
                          "${VALUE_ARG[@]}" > /dev/null \
                          && echo "Copied field ${FIELD_ID} (${TYPENAME}) to new project item ${NEW_ITEM_ID}" \
                          || echo "Failed to copy field ${FIELD_ID} (${TYPENAME}) to new project item ${NEW_ITEM_ID}" >> $GITHUB_STEP_SUMMARY
                  done
              done < <(echo "${ORIGINAL_PROJECT_ITEMS}" | jq -r '.[] | [.project.id, (.fieldValues.nodes | tojson)] | @tsv')
          fi
