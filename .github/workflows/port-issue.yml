name: Port issue
run-name: "Port issue ${{ github.event.issue.number }}: ${{ github.event.issue.title }}"

on:
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  port-issue:
    runs-on: ubuntu-latest
    if: startsWith(github.event.comment.body, '/backport') || startsWith(github.event.comment.body, '/forwardport')
    steps:
      - name: Check org membership
        id: membership
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          if gh api orgs/${GITHUB_REPOSITORY_OWNER}/members --paginate | jq -e --arg GITHUB_ACTOR "$GITHUB_ACTOR" '.[] | select(.login == $GITHUB_ACTOR)' > /dev/null; then
              echo "${GITHUB_ACTOR} is a member"
              echo "is_member=true" >> $GITHUB_OUTPUT
          else
              echo "${GITHUB_ACTOR} is not a member of ${GITHUB_REPOSITORY_OWNER}" >> $GITHUB_STEP_SUMMARY
              echo "is_member=false" >> $GITHUB_OUTPUT
          fi
      - name: Check milestone
        if: steps.membership.outputs.is_member == 'true'
        id: milestone
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ORIGINAL_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          BODY_MILESTONE=$(echo "${COMMENT_BODY}" | awk '{ print $2 }')
          # Sanitize input
          MILESTONE=${BODY_MILESTONE//[^a-zA-Z0-9\-\.]/}
          if gh api repos/${GITHUB_REPOSITORY}/milestones --paginate | jq -e --arg MILESTONE "$MILESTONE" '.[] | select(.title == $MILESTONE)' > /dev/null; then
              echo "Milestone exists"
              echo "milestone_exists=true" >> $GITHUB_OUTPUT
           else
              echo "Milestone ${MILESTONE} does not exist" >> $GITHUB_STEP_SUMMARY
              gh issue comment -R ${GITHUB_REPOSITORY} ${ORIGINAL_ISSUE_NUMBER} --body "Not creating port issue, milestone ${MILESTONE} does not exist or is not an open milestone"
              echo "milestone_exists=false" >> $GITHUB_OUTPUT
           fi
      - name: Port issue
        if: |
          steps.membership.outputs.is_member == 'true' &&
          steps.milestone.outputs.milestone_exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ORIGINAL_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          declare -a additional_cmd
          BODY=$(mktemp)
          ORIGINAL_ISSUE=$(gh issue view -R ${GITHUB_REPOSITORY} ${ORIGINAL_ISSUE_NUMBER} --json title,body,assignees,issueType)
          ORIGINAL_TITLE=$(echo "${ORIGINAL_ISSUE}" | jq -r .title)
          ORIGINAL_TYPE=$(echo "${ORIGINAL_ISSUE}" | jq -r '.issueType.name // empty')
          if [ -n "$ORIGINAL_TYPE" ]; then
              additional_cmd+=("--type")
              additional_cmd+=("${ORIGINAL_TYPE}")
          fi
          TYPE=$(echo "${COMMENT_BODY}" | awk '{ print $1 }' | sed -e 's_/__')
          MILESTONE=$(echo "${COMMENT_BODY}" | awk '{ print $2 }')
          NEW_TITLE="[${TYPE}] ${ORIGINAL_TITLE}"
          # rancher/rancher title
          if [[ $MILESTONE =~ (v[0-9]\.[0-9]+) ]]; then
              NEW_TITLE="[${TYPE} ${BASH_REMATCH[1]}] ${ORIGINAL_TITLE}"
          fi
          # rancher/rke2 title
          # MAJOR_MINOR_MILESTONE=$(echo $MILESTONE | cut -d. -f1,2)
          # NEW_TITLE="[${TYPE} release-${MAJOR_MINOR_MILESTONE}] ${ORIGINAL_TITLE}"
          ORIGINAL_LABELS=$(gh issue view -R ${GITHUB_REPOSITORY} ${ORIGINAL_ISSUE_NUMBER} --json labels --jq '.labels[].name' | grep -v '^\[zube\]:' | paste -sd "," -)
          if [ -n "$ORIGINAL_LABELS" ]; then
              additional_cmd+=("--label")
              additional_cmd+=("${ORIGINAL_LABELS}")
          fi
          ORIGINAL_PROJECT=$(gh issue view -R ${GITHUB_REPOSITORY} ${ORIGINAL_ISSUE_NUMBER} --json projectItems --jq '.projectItems[].title')
          if [ -n "$ORIGINAL_PROJECT" ]; then
              additional_cmd+=("--project")
              additional_cmd+=("${ORIGINAL_PROJECT}")
          fi
          ASSIGNEES=$(echo "${ORIGINAL_ISSUE}" | jq -r .assignees[].login)
          if [ -n "$ASSIGNEES" ]; then
              echo "Checking if assignee is member before assigning"
              # Fetch organization members once to reduce API calls
              ORG_MEMBERS=$(gh api orgs/${GITHUB_REPOSITORY_OWNER}/members --paginate | jq -r '.[].login')
              DELIMITER=""
              NEW_ASSIGNEES=""
              for ASSIGNEE in $ASSIGNEES; do
                  # Exclude Copilot assignees (copilot, copilot-swe-agent, etc.)
                  if [[ "${ASSIGNEE,,}" =~ ^copilot(-.+)?$ ]]; then
                      echo "Skipping Copilot assignee: ${ASSIGNEE}"
                      continue
                  fi
                  if echo "$ORG_MEMBERS" | grep -Fqx "$ASSIGNEE"; then
                      echo "${ASSIGNEE} is a member, adding to assignees"
                      NEW_ASSIGNEES="${NEW_ASSIGNEES}${DELIMITER}${ASSIGNEE}"
                      DELIMITER=","
                  fi
              done
              if [ -n "$NEW_ASSIGNEES" ]; then
                  echo "Assignees for new issue: ${NEW_ASSIGNEES}"
                  additional_cmd+=("--assignee")
                  additional_cmd+=("${NEW_ASSIGNEES}")
              fi
          fi
          if [ -n "$MILESTONE" ]; then
              echo -e "This is a ${TYPE} issue for #${ORIGINAL_ISSUE_NUMBER}, automatically created via [GitHub Actions workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) initiated by @${GITHUB_ACTOR}\n" > $BODY
              echo -e "\nOriginal issue body:\n" >> $BODY
              echo "${ORIGINAL_ISSUE}" | jq -r '.body[0:65536]' >> $BODY
              NEW_ISSUE=$(gh issue create -R "${GITHUB_REPOSITORY}" --title "${NEW_TITLE}" --body-file "${BODY}" -m "${MILESTONE}" "${additional_cmd[@]}")
              echo "Port issue created: ${NEW_ISSUE}" >> $GITHUB_STEP_SUMMARY

              # Copy top-level GitHub Issue Fields (e.g. Priority, Effort, Start date,
              # Target date) from the original issue to the newly created one. These
              # are org-level custom fields defined at the organization level and are
              # distinct from labels, milestones, and Project v2 field values.
              # The API is currently in private preview and requires the
              # `GraphQL-Features: issue_fields` header.
              NEW_ISSUE_NUMBER=$(echo "${NEW_ISSUE}" | awk -F/ '{ print $NF }')
              REPO_OWNER="${GITHUB_REPOSITORY%/*}"
              REPO_NAME="${GITHUB_REPOSITORY#*/}"

              ORIGINAL_FIELD_VALUES=$(gh api graphql \
                  -H "GraphQL-Features: issue_fields" \
                  -f query='query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        issueFieldValues(first: 50) {
                          nodes {
                            __typename
                            ... on IssueFieldSingleSelectValue {
                              value
                              field { ... on IssueFieldSingleSelect { id options { id name } } }
                            }
                            ... on IssueFieldDateValue {
                              value
                              field { ... on IssueFieldDate { id } }
                            }
                            ... on IssueFieldTextValue {
                              value
                              field { ... on IssueFieldText { id } }
                            }
                            ... on IssueFieldNumberValue {
                              value
                              field { ... on IssueFieldNumber { id } }
                            }
                          }
                        }
                      }
                    }
                  }' \
                  -f owner="${REPO_OWNER}" \
                  -f repo="${REPO_NAME}" \
                  -F number="${ORIGINAL_ISSUE_NUMBER}" \
                  --jq '.data.repository.issue.issueFieldValues.nodes' 2>/dev/null || echo "[]")

              NEW_ISSUE_ID=$(gh api graphql \
                  -f query='query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) { id }
                    }
                  }' \
                  -f owner="${REPO_OWNER}" \
                  -f repo="${REPO_NAME}" \
                  -F number="${NEW_ISSUE_NUMBER}" \
                  --jq '.data.repository.issue.id')

              # Build the issueFields array for a single setIssueFieldValue mutation.
              # For single-select fields the API needs the option's id, not its name,
              # so we resolve it from the field's options list included in the query.
              ISSUE_FIELDS_JSON=$(echo "${ORIGINAL_FIELD_VALUES}" | jq -c '
                  [ .[]
                    | . as $v
                    | ($v.field.id // empty) as $fid
                    | select($fid != "")
                    | if $v.__typename == "IssueFieldSingleSelectValue" then
                          ( ($v.field.options // []) | map(select(.name == $v.value)) | .[0].id // empty ) as $oid
                          | select($oid != "")
                          | {fieldId: $fid, singleSelectOptionId: $oid}
                      elif $v.__typename == "IssueFieldDateValue" and ($v.value // "") != "" then
                          {fieldId: $fid, dateValue: $v.value}
                      elif $v.__typename == "IssueFieldTextValue" and ($v.value // "") != "" then
                          {fieldId: $fid, textValue: $v.value}
                      elif $v.__typename == "IssueFieldNumberValue" and ($v.value != null) then
                          {fieldId: $fid, numberValue: ($v.value | tonumber)}
                      else empty end
                  ]')

              if [ -n "$NEW_ISSUE_ID" ] && [ -n "$ISSUE_FIELDS_JSON" ] && [ "$ISSUE_FIELDS_JSON" != "[]" ]; then
                  MUTATION_PAYLOAD=$(jq -n \
                      --arg issueId "$NEW_ISSUE_ID" \
                      --argjson issueFields "$ISSUE_FIELDS_JSON" \
                      '{
                          query: "mutation($issueId: ID!, $issueFields: [IssueFieldCreateOrUpdateInput!]!) { setIssueFieldValue(input: {issueId: $issueId, issueFields: $issueFields}) { issue { id } } }",
                          variables: { issueId: $issueId, issueFields: $issueFields }
                      }')
                  if echo "$MUTATION_PAYLOAD" | gh api graphql \
                          -H "GraphQL-Features: issue_fields" \
                          --input - > /dev/null 2>&1; then
                      echo "Copied issue field values: ${ISSUE_FIELDS_JSON}"
                  else
                      echo "Failed to copy issue field values (${ISSUE_FIELDS_JSON}) to new issue" >> $GITHUB_STEP_SUMMARY
                  fi
              else
                  echo "No issue field values to copy"
              fi
          fi
