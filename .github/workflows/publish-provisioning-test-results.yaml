name: Publish Provisioning Tests Results
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- artifacts are published only for successful or failed runs from this repository.
    workflows: ["Build Pull Request"]
    types:
      - completed
permissions: {}

jobs:
  publish-provisioning-test-results:
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: registry.suse.com/bci/bci-base@sha256:f210b01e65ad0d6485cdac7236475101613be1206740e3dc97b53007aaffa1e1 # 15.7
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      checks: write
      pull-requests: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish Test Results
        uses: ./.github/actions/publish-provisioning-test-results
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event-name: ${{ github.event.workflow_run.event }}
          # download the fork's artifacts from the run that triggered this handler
          run-id: ${{ github.event.workflow_run.id }}
