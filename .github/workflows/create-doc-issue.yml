name: Create doc issue
run-name: "Create doc issue for ${{ github.event.issue.number }}: ${{ github.event.issue.title }}"

on:
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  create-doc-issue:
    runs-on: ubuntu-latest
    if: |
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/create-doc-issue')
    steps:
      - name: Check org membership
        id: membership
        env:
          GITHUB_TOKEN: ${{ secrets.CREATE_DOCS_PAT }}
        run: |
          set -euo pipefail

          if gh api "orgs/${GITHUB_REPOSITORY_OWNER}/members" --paginate | jq -se --arg GITHUB_ACTOR "$GITHUB_ACTOR" 'add | any(.login == $GITHUB_ACTOR)' > /dev/null; then
              echo "is_member=true" >> "$GITHUB_OUTPUT"
          else
              echo "${GITHUB_ACTOR} is not a member of ${GITHUB_REPOSITORY_OWNER}" >> "$GITHUB_STEP_SUMMARY"
              echo "is_member=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create doc issue
        if: steps.membership.outputs.is_member == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.CREATE_DOCS_PAT }}
          ORIGINAL_ISSUE_NUMBER: ${{ github.event.issue.number }}
          ORIGINAL_ISSUE_URL: ${{ github.event.issue.html_url }}
          ORIGINAL_TITLE: ${{ github.event.issue.title }}
          ORIGINAL_MILESTONE: ${{ github.event.issue.milestone.title }}
          LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail

          if jq -e 'index("prime")' <<< "${LABELS_JSON}" > /dev/null; then
              TARGET_REPO="${GITHUB_REPOSITORY_OWNER}/prime-docs"
          else
              TARGET_REPO="${GITHUB_REPOSITORY_OWNER}/rancher-product-docs"
          fi

          NEW_TITLE="document: ${ORIGINAL_TITLE}"
          BODY="${ORIGINAL_ISSUE_URL}
          More information to be added upon request."

          declare -a additional_cmd=()
          MILESTONE_NOTE=""
          if [ -n "${ORIGINAL_MILESTONE}" ]; then
              if gh api "repos/${TARGET_REPO}/milestones" --paginate | jq -se --arg MILESTONE "${ORIGINAL_MILESTONE}" 'add | any(.title == $MILESTONE)' > /dev/null; then
                  additional_cmd+=("--milestone" "${ORIGINAL_MILESTONE}")
              else
                  MILESTONE_NOTE=" (milestone \`${ORIGINAL_MILESTONE}\` does not exist in ${TARGET_REPO}, so none was set)"
              fi
          fi

          NEW_ISSUE_URL=$(gh issue create -R "${TARGET_REPO}" \
              --title "${NEW_TITLE}" \
              --body "${BODY}" \
              ${additional_cmd[@]+"${additional_cmd[@]}"})

          gh issue comment -R "${GITHUB_REPOSITORY}" "${ORIGINAL_ISSUE_NUMBER}" \
              --body "Created doc issue: ${NEW_ISSUE_URL}${MILESTONE_NOTE}"
