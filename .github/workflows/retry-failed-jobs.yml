name: Retry failed jobs

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- only calls rerun-failed-jobs API, does not run untrusted code
    workflows:
      - "Build Pull Request"
      - "Push to release branches"
      - "Nightly Provisioning Tests"
    types: [completed]

jobs:
  retry:
    # Only retry once, only on failure.
    # For PRs, allow forks because CI runs live in this repository.
    # For push workflows, restrict to this repository.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/actions/runs/$RUN_ID/rerun-failed-jobs"

  retry-nightly:
    # We execute the nightly provisioning tests 3 times
    # to avoid false alarms from flaky tests. This should
    # be removed or shortened once the tests are more stable.
    #
    # Canceled runs are also retried, since the CI system occasionally
    # cancels jobs with 'Error: The operation was canceled.' This only applies
    # when the run was started by a bot and the latest attempt was started
    # by a bot. Runs started or re-run by a human are not retried when canceled.
    if: >-
      github.event.workflow_run.name == 'Nightly Provisioning Tests' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.run_attempt < 3 &&
      (github.event.workflow_run.conclusion == 'failure' ||
       (github.event.workflow_run.conclusion == 'cancelled' &&
        github.event.workflow_run.actor.type == 'Bot' &&
        github.event.workflow_run.triggering_actor.type == 'Bot'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
    steps:
      # The workflow_run payload does not record who canceled a run, so a
      # human canceling a bot-started run is indistinguishable by actor alone.
      # Manual cancellations leave an annotation on the canceled jobs reading
      # 'The run was canceled by @<user>.' CI flakes leave no such annotation.
      - name: Check for manual cancellation
        id: check-cancel
        if: github.event.workflow_run.conclusion == 'cancelled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          job_ids=$(gh api --paginate \
            "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | select(.conclusion == "cancelled") | .id')

          for job_id in $job_ids; do
            messages=$(gh api --paginate "repos/${REPO}/check-runs/${job_id}/annotations" \
              --jq '.[].message')
            if grep -qF 'The run was canceled by' <<< "$messages"; then
              echo "Job ${job_id} was canceled manually, not retrying:"
              echo "$messages"
              echo "manual=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No manual cancellation found on canceled jobs, treating as CI flake."
          echo "manual=false" >> "$GITHUB_OUTPUT"

      - name: Rerun failed jobs
        if: steps.check-cancel.outputs.manual != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api \
            --method POST \
            "repos/${REPO}/actions/runs/$RUN_ID/rerun-failed-jobs"
