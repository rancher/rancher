name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: ["main", "release/v*"]
  # TEMPORARY: pull_request trigger disabled on this CI-test-only branch to
  # avoid burning runner resources on jobs unrelated to the cache
  # benchmark this PR exists for. Restore before this branch is used for
  # anything real -- see the same marker in controller-test.yml,
  # validate.yml, and verify-generated-code-changes.yml.
  # pull_request:
  #   branches: ["**"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # used by zizmor to write events for advanced security features
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
