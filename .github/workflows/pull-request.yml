      - name: "Report cache hit status (both should be true)"
        run: |
          echo "gomod cache-hit=${{ steps.cache-gomod.outputs.cache-hit }}"
          echo "bucket cache-hit=${{ steps.cache-bucket.outputs.cache-hit }}"
          if [ "${{ steps.cache-gomod.outputs.cache-hit }}" != "true" ] || [ "${{ steps.cache-bucket.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Expected cache hits on the warm job but got a miss -- actions/cache restore did not work as expected."
            exit 1
          fi
          echo "Restored GOMODCACHE size:"
          du -sh go-build-cache-benchmark-gocacheprog-gomod || true
          echo "Restored GOCACHEPROG bucket size:"
          du -sh go-build-cache-benchmark-gocacheprog-bucket || true
      - name: "Timed build (server-build-gocacheprog, warm GOCACHE via GOCACHEPROG, warm GOMODCACHE)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --build-arg "GOCACHE_IN=gocache" \
            --build-context "gocache=go-build-cache-benchmark-gocacheprog-gomod" \
            --build-arg "GOCACHEPROG_BUCKET_IN=gocacheprogbucket" \
            --build-context "gocacheprogbucket=go-build-cache-benchmark-gocacheprog-bucket" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target server-build-gocacheprog \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Warm (GOCACHEPROG) build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Warm (GOCACHEPROG, server-build-gocacheprog): ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"
        # No --output, same rationale as the cold job's timed-build step.
        # This is the real number of interest: does a small-diff PR (here,
        # source is IDENTICAL between cold and warm since this is a
        # same-commit re-run, so it's an upper bound on GOCACHEPROG's
        # fine-grained-fetch benefit) get a genuinely fast GOCACHE
        # restore via GOCACHEPROG vs. the coarse-grained COPY/bind-mount
        # designs above having to stage the WHOLE cache directory first.

