name: Build Pull Request
on:
  pull_request:
    paths-ignore:
      # omit tests from triggering CI except when CI tests are changed
      - "tests/v2/codecoverage/**"
      - "tests/validation/**"

permissions:
  contents: read
  id-token: none

env:
  ARCH: amd64
  TAG: v2.14-${{ github.sha }}-head
  GIT_TAG: v2.14-${{ github.sha }}-head
  HEAD_TAG: "head"
  COMMIT: ${{ github.sha }}
  REPOSITORY_OWNER: ${{ github.repository_owner }}
  IMAGE: ${{ github.repository_owner }}/rancher
  IMAGE_AGENT: ${{ github.repository_owner }}/rancher-agent
  IMAGE_INSTALLER: ${{ github.repository_owner }}/system-agent-installer-rancher
jobs:
  # ---------------------------------------------------------------------
  # TEMPORARY: every job below other than cache-benchmark-* is disabled
  # (if: false) on this CI-test-only branch, to avoid burning EIO runner
  # resources on real image builds/tests unrelated to the go build/mod
  # cache benchmark this PR exists for. Restore (remove the if: false
  # lines) before this branch is used for anything beyond the benchmark.
  # ---------------------------------------------------------------------
  unit-tests:
    if: false
    uses: ./.github/workflows/unit-test.yml
  build-chart:
    if: false
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.26
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: setup and build
        uses: ./.github/actions/rancher-chart/build
  build-server:
    if: false
    strategy:
      matrix:
        os: [linux]
        arch: [x64, arm64]
    runs-on: runs-on,runner=4cpu-${{ matrix.os }}-${{ matrix.arch }},image=ubuntu22-full-${{ matrix.arch }},extras=s3-cache,run-id=${{ github.run_id }}
    env:
      ARCH: ${{ matrix.arch }}
      OS: ${{ matrix.OS }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: setup and build
        uses: ./.github/actions/build-images/server
  build-agent:
    if: false
    strategy:
      matrix:
        os: [linux]
        arch: [x64, arm64]
    runs-on: runs-on,runner=4cpu-${{ matrix.os }}-${{ matrix.arch }},image=ubuntu22-full-${{ matrix.arch }},extras=s3-cache,run-id=${{ github.run_id }}
    env:
      ARCH: ${{ matrix.arch }}
      OS: ${{ matrix.OS }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: setup and build
        uses: ./.github/actions/build-images/agent
  build-installer:
    if: false
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,run-id=${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Verify installer Dockerfile build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./package/Dockerfile.installer
          build-args: |
            BUILDARCH=amd64
            VERSION=0.0.0
          platforms: linux/amd64
          load: false
          push: false
          cache-from: type=gha,scope=pr-build-installer
          cache-to: type=gha,mode=min,scope=pr-build-installer

  # ---------------------------------------------------------------------
  # TEMPORARY: cache-benchmark-{cold,warm} -- proves out a go build/mod
  # cache persisted via a plain COPY from an extra buildx build-context
  # (package/Dockerfile's GOCACHE_IN arg / gocache-in, gocache-out stages)
  # instead of RUN --mount=type=cache, using this real PR's pull_request
  # trigger (since workflow_dispatch isn't reachable from a non-default-
  # branch workflow file). Not wired into any real build path
  # (build-server/build-agent are untouched by these two jobs) -- safe to
  # drop once the benchmark numbers are in hand. Remove this whole block,
  # and the TEMPORARY-marked additions in package/Dockerfile, before
  # merging the caching change for real.
  #
  # Why not RUN --mount=type=cache (see earlier attempt in this PR's
  # history): this runner fleet's BuildKit daemon caps exec.cachemount
  # (the storage class RUN --mount=type=cache lives in) GC budget at
  # ~488MiB, far below the ~10GB go build/mod cache this repo needs --
  # BuildKit silently evicted almost all of it before it could be
  # extracted. A plain COPY into a normal image layer instead falls under
  # BuildKit's much larger regular-layer GC budget (~90GB on this fleet),
  # sidestepping that ceiling entirely.
  #
  # cache-benchmark-cold builds server with an empty (scratch) gocache-in
  # context against a scratch actions/cache key that is unique per
  # workflow run (so every push to this PR branch re-runs a genuine cold
  # start), times the build, then does a second (near-instant, since the
  # builder + layers are already warm) buildx invocation targeting
  # gocache-out to extract the now-populated /root/.cache directory back
  # onto the runner's disk, and always saves it via actions/cache.
  #
  # cache-benchmark-warm needs: cache-benchmark-cold (so the save has
  # already committed by the time this job starts), restores the SAME
  # scratch key -- this must hit -- passes the restored directory in as
  # the gocache-in build-context, builds again, and never writes back.
  # Fails loudly if the expected hit doesn't happen so a bad number can't
  # sneak through silently.
  # ---------------------------------------------------------------------
  cache-benchmark-cold:
    if: false  # TEMPORARY: disabled while iterating on new k3s-focused cache-mount jobs below -- re-enable when resuming this comparison
    # Tried volume=200gb:gp3:500mbs:4000iops first (finer-grained size/
    # type/throughput/IOPS control, added in RunsOn v2.9) but it had no
    # effect: the runner's own "Runner details" table still showed the
    # default ~120GB disk (Free=105.39GiB) and the tarball export step's
    # timing was unchanged run over run. This org's RunsOn deployment only
    # supports the older disk=default / disk=large label, not volume=.
    # disk=large gives 250GB (vs 125GB default) per the EIO runner docs --
    # confirmed against this fleet's actual supported label set, not
    # assumed from RunsOn's general docs. Bigger disk alone doesn't
    # guarantee more IOPS/throughput (see disk=default vs disk=large
    # semantics -- this is a capacity request, not the performance-tier
    # volume= mechanism above), but it's the tool actually available here,
    # so trying it to see whether the larger volume type still ships
    # faster baseline performance than the smaller default in practice.
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,extras=s3-cache,disk=large,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Unique per workflow run -- guaranteed to not exist yet, so this is a
      # genuine cold start every time the PR branch is pushed.
      - name: "Restore go build/mod cache (expected: miss)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache-benchmark
          key: rancher-gocache-benchmark-${{ github.run_id }}
      - name: "Report cache hit status (should be false)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "::warning::Expected a cache miss on the cold job but got a hit -- scratch key collided, results are not trustworthy."
          fi
          mkdir -p go-build-cache-benchmark
      - name: "Timed build (server, cold/empty gocache-in)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --build-arg "GOCACHE_IN=gocache" \
            --build-context "gocache=go-build-cache-benchmark" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target server \
            --output type=docker,dest=/tmp/rancher-cache-benchmark-cold.tar \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Cold build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Cold build: ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Extract populated go build/mod cache
        shell: bash
        run: |
          # Sample disk/CPU load in the background for the duration of this
          # step, to help attribute the ~150s gap consistently observed
          # (across every run so far) between BuildKit resolving the final
          # CACHED layer and it actually starting the COPY --from=
          # server-build step -- that gap shows zero progress output, so
          # something is happening that isn't visible in buildx's default
          # progress format. Falls back to /proc/stat + /proc/diskstats if
          # iostat/sysstat isn't installed on this runner image.
          ( while true; do
              echo "[monitor $(date -u +%H:%M:%S)]"
              if command -v iostat >/dev/null 2>&1; then
                iostat -x 1 1 | tail -n +4
              else
                echo "cpu: $(head -1 /proc/stat)"
                echo "disk (nvme0n1p1): $(grep nvme0n1p1 /proc/diskstats || true)"
              fi
              sleep 5
            done ) &
          MONITOR_PID=$!
          time docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --progress=plain \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --build-arg "GOCACHE_IN=gocache" \
            --build-context "gocache=go-build-cache-benchmark" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target gocache-out \
            --output type=tar,dest=go-build-cache-benchmark.tar \
            .
          kill "$MONITOR_PID" 2>/dev/null || true
          echo "tar size:"
          du -sh go-build-cache-benchmark.tar
          mkdir -p go-build-cache-benchmark-extracted
          time tar -xf go-build-cache-benchmark.tar -C go-build-cache-benchmark-extracted
          rm -f go-build-cache-benchmark.tar
          rm -rf go-build-cache-benchmark
          mv go-build-cache-benchmark-extracted go-build-cache-benchmark
        # IMPORTANT: every --build-arg / --build-context here must exactly
        # match the "Timed build" step above. BuildKit's layer cache key
        # covers the WHOLE dependency graph leading to --target, not just
        # the target stage itself -- even though gocache-out only
        # *declares* a dependency on server-build, a differing ARG/context
        # anywhere upstream (e.g. dropping GOCACHE_IN/gocache-in here)
        # makes BuildKit treat rancher-go-builder's COPY --from=gocache-in
        # step, and everything after it, as a fresh cache miss, silently
        # re-running the entire go mod download + go build from scratch a
        # second time instead of the near-instant extraction this step is
        # supposed to be. (This is exactly what happened in an earlier
        # run of this job: the extraction step ran for ~50+ minutes doing
        # an undetected second cold build before it was caught and killed.)
        #
        # type=tar instead of type=local: a prior run with type=local
        # showed every upstream layer as CACHED (confirming the ARG/context
        # fix above worked) but then hung for 20+ minutes on "exporting to
        # client directory" / "copying files" -- BuildKit's local exporter
        # writing ~10GB as a real directory tree onto the runner's disk is
        # apparently very slow here (guess: per-file syscall overhead,
        # possibly compounded by spot-instance disk I/O limits). type=tar
        # streams a single tar archive instead, which should avoid that
        # per-file overhead; we then extract it locally with plain `tar`.
        # `time` wraps both the buildx export and the local tar extraction
        # so the actual split can be inspected in the step's own log
        # output if this still turns out to be slow.
        #
        # Extract into a fresh directory first, then swap it in -- do NOT
        # delete go-build-cache-benchmark before the buildx build runs,
        # since it's still needed as the gocache-in build-context input.

  cache-benchmark-warm:
    if: false  # TEMPORARY: disabled while iterating on new k3s-focused cache-mount jobs below -- re-enable when resuming this comparison
    needs: cache-benchmark-cold
    # Same disk=large rationale as cache-benchmark-cold -- this job also
    # restores the ~10GB cache from actions/cache onto local disk before
    # the build. Kept in sync with cache-benchmark-cold's disk setting so
    # the cold vs. warm comparison isn't confounded by one job having a
    # different disk than the other.
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,extras=s3-cache,disk=large,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Same scratch key as cache-benchmark-cold. Must hit -- that job's
      # save step already committed by the time this job starts
      # (needs: cache-benchmark-cold).
      - name: "Restore go build/mod cache (expected: hit)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache-benchmark
          key: rancher-gocache-benchmark-${{ github.run_id }}
      - name: "Report cache hit status (should be true)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Expected a cache hit on the warm job but got a miss -- Magic Cache / actions/cache restore did not work as expected."
            exit 1
          fi
          echo "Restored cache size:"
          du -sh go-build-cache-benchmark || true
      - name: "Timed build (server, warm gocache-in)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --build-arg "GOCACHE_IN=gocache" \
            --build-context "gocache=go-build-cache-benchmark" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target server \
            --output type=docker,dest=/tmp/rancher-cache-benchmark-warm.tar \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Warm build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Warm build: ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"

  cache-benchmark-warm-8cpu:
    if: false  # TEMPORARY: disabled while iterating on new k3s-focused cache-mount jobs below -- re-enable when resuming this comparison
    needs: cache-benchmark-cold
    # Same as cache-benchmark-warm, but on an 8cpu runner instead of 4cpu,
    # to see whether the warm build (which still does a real go build,
    # just without needing to download/compile from scratch) is CPU-bound
    # enough that doubling cores meaningfully cuts the time -- separate
    # from the earlier disk=large experiment. Duplicated as its own job
    # (rather than a matrix on cache-benchmark-warm) to keep the existing
    # 4cpu number directly comparable/unchanged.
    runs-on: runs-on,runner=8cpu-linux-x64,image=ubuntu22-full-x64,extras=s3-cache,disk=large,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Same scratch key as cache-benchmark-cold. Must hit -- that job's
      # save step already committed by the time this job starts
      # (needs: cache-benchmark-cold).
      - name: "Restore go build/mod cache (expected: hit)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache-benchmark
          key: rancher-gocache-benchmark-${{ github.run_id }}
      - name: "Report cache hit status (should be true)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Expected a cache hit on the warm job but got a miss -- Magic Cache / actions/cache restore did not work as expected."
            exit 1
          fi
          echo "Restored cache size:"
          du -sh go-build-cache-benchmark || true
      - name: "Timed build (server, warm gocache-in, 8cpu)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --build-arg "GOCACHE_IN=gocache" \
            --build-context "gocache=go-build-cache-benchmark" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target server \
            --output type=docker,dest=/tmp/rancher-cache-benchmark-warm-8cpu.tar \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Warm (8cpu) build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Warm (8cpu) build: ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # TEMPORARY: cache-benchmark-{cold,warm}-cachemount -- tests the
  # ORIGINAL RUN --mount=type=cache mechanism (what this Dockerfile used
  # before any of the COPY-based/bind-mount-based work in this PR),
  # combined with a custom buildkitd GC policy (via
  # --buildkitd-config-inline on "Set up Docker Buildx") that raises the
  # exec.cachemount maxUsedSpace ceiling. Earlier in this PR, an
  # unmodified RUN --mount=type=cache + buildkit-cache-dance run showed
  # the extraction step save only ~200 bytes instead of the real ~10GB
  # cache -- this runner fleet's default GC policy caps exec.cachemount
  # (the storage class RUN --mount=type=cache lives in) at ~488MiB,
  # evicting nearly everything before extraction could run. This job
  # raises that ceiling for just this job's own builder instance (created
  # fresh by "Set up Docker Buildx" in the docker-container driver, so
  # the override is fully scoped to this job -- it does not touch the
  # runner fleet's actual daemon or any other job's builder).
  #
  # Sequential per request: cache-benchmark-warm-cachemount needs:
  # cache-benchmark-cold-cachemount, so the dance's cache save from cold
  # has already completed by the time warm starts and restores it.
  #
  # If successful, this is likely the best of the three approaches tried
  # in this PR: RUN --mount=type=cache content never becomes a committed
  # image layer at all (unlike the COPY approach's gocache-in/out COPY
  # materialization, and its ~7min extraction/tar-export tax), and
  # buildkit-cache-dance's inject/extract is a plain filesystem copy
  # in/out of the mount's on-disk cache directory -- no image layer COPY,
  # no buildx --output export round-trip needed at all to persist it via
  # actions/cache.
  # ---------------------------------------------------------------------
  cache-benchmark-cold-cachemount:
    if: false  # TEMPORARY: disabled while iterating on new k3s-focused cache-mount jobs below -- re-enable when resuming this comparison
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,extras=s3-cache,disk=large,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Raise exec.cachemount's maxUsedSpace from this fleet's
          # default ~488MiB to 12GB (comfortably above the ~10GB cache
          # this repo needs). filters/keepDuration copied verbatim from
          # this fleet's own default gcpolicy (captured via `docker
          # buildx inspect` earlier in this PR) so only maxUsedSpace
          # actually changes. Second gcpolicy block (catch-all, "all =
          # true") is BuildKit's own documented default fallback for
          # everything not matched by the first policy -- included so we
          # aren't accidentally disabling GC for regular image layers.
          buildkitd-config-inline: |
            [worker.oci]
              [[worker.oci.gcpolicy]]
                keepDuration = "48h"
                filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
                maxUsedSpace = "12GB"
              [[worker.oci.gcpolicy]]
                all = true
                reservedSpace = "1GB"
      - name: "Restore go build/mod cache (expected: miss)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache-benchmark-mount
          key: rancher-gocache-benchmark-mount-${{ github.run_id }}
      - name: "Report cache hit status (should be false)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "::warning::Expected a cache miss on the cold job but got a hit -- scratch key collided, results are not trustworthy."
          fi
      - name: "Inject (likely empty) cache into BuildKit (debug: hand-rolled, verbose)"
        id: inject
        shell: bash
        run: |
          set -x
          mkdir -p go-build-cache-benchmark-mount scratch
          # IMPORTANT: buildstamp goes in the CACHE dir (the build
          # context), not the scratch dir -- confirmed against the real
          # dance action's decompiled source: it calls
          # writeFile(join(cacheDir, "buildstamp"), ...) and then passes
          # cacheDir (not scratchDir) as the build context to `docker
          # buildx build`, while writing the actual Dockerfile itself
          # into scratchDir. My first hand-rolled attempt got this
          # backwards (wrote buildstamp to scratch/, built against the
          # cache dir as context) and failed immediately with "/buildstamp":
          # not found -- which, notably, is the FIRST real error message
          # we've seen in this whole cache-mount investigation, since the
          # vendored action's silent wrapper never surfaced it.
          date -u -Iseconds > go-build-cache-benchmark-mount/buildstamp
          {
            echo 'FROM ghcr.io/containerd/busybox:latest'
            echo 'COPY buildstamp buildstamp'
            echo 'RUN --mount=type=cache,target=/root/.cache,id=rancher-cache-mount-bench \'
            echo '    --mount=type=bind,source=.,target=/var/dance-cache \'
            echo '    cp -p -R /var/dance-cache/. /root/.cache && echo INJECT_CP_OK || echo INJECT_CP_FAILED'
          } > scratch/Dancefile.inject
          echo "=== Dancefile.inject ==="
          cat scratch/Dancefile.inject
          echo "=== source dir being injected (should be empty except buildstamp, on cold run) ==="
          find go-build-cache-benchmark-mount -maxdepth 2 | head -20
          du -sh go-build-cache-benchmark-mount || true
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            -f scratch/Dancefile.inject \
            --tag dance:inject \
            --progress=plain \
            go-build-cache-benchmark-mount 2>&1 | tee /tmp/inject-build.log
          echo "=== full inject build log ==="
          cat /tmp/inject-build.log
          echo "=== exec.cachemount storage right after inject ==="
          docker buildx du --verbose --builder "${{ steps.setup-buildx.outputs.name }}" 2>&1 | grep -B8 "exec.cachemount" || true
        # This step is a debug replacement for the vendored
        # buildkit-cache-dance's inject phase, since that action's own
        # commands run through a silent wrapper (spawn-please) that only
        # ever surfaces output on non-zero exit -- successful `docker
        # buildx build`, `docker create`, `docker cp` calls are invisible
        # in the log by design, which made a real ~10GB save silently
        # turning into an ~200 byte save impossible to diagnose from
        # dance's own output. Rewriting inject/extract by hand here
        # (using --progress=plain and explicit `tee`/`cat` of full build
        # output) so we can actually see what BuildKit is doing at each
        # step, instead of continuing to guess against a black box.
        #
        # ROOT CAUSE FOUND (confirmed via local repro against docker
        # buildx + docker-container driver, outside this fleet entirely):
        # this step must NOT pass --no-cache. BuildKit does not dedupe
        # `RUN --mount=type=cache,id=X` instances purely by `id=` -- it
        # keys the cache-mount instance to the cached LAYER LINEAGE that
        # RUN belongs to. `--no-cache` cache-busts every layer including
        # the cache-mount RUN itself, so BuildKit allocates a fresh, empty
        # cache-mount instance for that id on every --no-cache invocation,
        # regardless of what other (non---no-cache) builds already
        # populated for the same id. Confirmed locally: two consecutive
        # `docker buildx build --no-cache` calls with an IDENTICAL
        # Dockerfile and identical `id=` produce two different internal
        # cache-mount IDs in `docker buildx du` output (different `Created
        # at` timestamps) -- content written by the first is invisible to
        # the second. Removing --no-cache (letting the RUN --mount layer
        # cache-HIT normally) makes the SAME cache-mount instance persist
        # across separate `docker buildx build` invocations, including
        # entirely different Dockerfiles using the same id=. This is likely
        # also the real explanation for reproducible-containers/
        # buildkit-cache-dance#33 upstream, though the real dance action
        # doesn't pass --no-cache itself -- our own hand-rolled debug
        # version added it to force a clean measurement each run, which is
        # exactly what broke this.

      - name: "Timed build (server-build-mount, cold cache mount)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target server-build-mount \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Cold (cache mount) build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Cold (cache mount, server-build-mount): ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"
        # No --output: server-build-mount's point is to exercise the RUN
        # --mount=type=cache steps, not to produce a usable image.
      - name: "Report exec.cachemount storage held by BuildKit"
        shell: bash
        run: |
          docker buildx du --verbose --builder "${{ steps.setup-buildx.outputs.name }}" || true
        # Full (unfiltered) output this time -- the earlier grep-filtered
        # version only matched "Type:" lines and never showed the actual
        # "Size:" field, so it wasn't actually useful as a sanity check.
      - name: "Extract populated cache (debug: hand-rolled, verbose, --output=local, no --load)"
        shell: bash
        run: |
          set -x
          mkdir -p scratch
          date -u -Iseconds > scratch/buildstamp
          # Two-stage Dancefile: stage 1 does the same cache-mount RUN cp as
          # before (exec.cachemount id must match exactly, same as inject
          # and the timed build). Stage 2 is FROM scratch and COPYs only
          # /var/dance-cache out of stage 1, so `--output type=local` can
          # export just that content directly to the runner's disk --
          # exactly how approach #1 (COPY-based)'s gocache-out extraction
          # already works reliably. This entirely avoids the
          # --load + docker create + docker export/cp round-trip through
          # the host Docker daemon, which upstream
          # (reproducible-containers/buildkit-cache-dance#33, open since
          # Jun 2024, still unresolved) and our own hand-rolled attempt
          # both point to as the likely place cache-mount content silently
          # goes missing (EXTRACT_CP_OK prints, but the --load'd image
          # ends up empty of it).
          {
            echo 'FROM ghcr.io/containerd/busybox:latest AS extract-stage'
            echo 'COPY buildstamp buildstamp'
            echo 'RUN --mount=type=cache,target=/root/.cache,id=rancher-cache-mount-bench \'
            echo '    mkdir -p /var/dance-cache/ \'
            echo '    && cp -p -R /root/.cache/. /var/dance-cache/ && echo EXTRACT_CP_OK || echo EXTRACT_CP_FAILED'
            echo ''
            echo 'FROM scratch AS export'
            echo 'COPY --from=extract-stage /var/dance-cache /'
          } > scratch/Dancefile.extract
          echo "=== Dancefile.extract ==="
          cat scratch/Dancefile.extract
          rm -rf go-build-cache-benchmark-mount
          mkdir -p go-build-cache-benchmark-mount
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            -f scratch/Dancefile.extract \
            --target export \
            --progress=plain \
            --output "type=local,dest=$(pwd)/go-build-cache-benchmark-mount" \
            scratch 2>&1 | tee /tmp/extract-build.log
          echo "=== full extract build log ==="
          cat /tmp/extract-build.log
          echo "=== extracted cache dir size on host disk ==="
          du -sh go-build-cache-benchmark-mount || true
          find go-build-cache-benchmark-mount -maxdepth 2 | head -20
        # Hand-rolled replacement for the vendored dance action's
        # (invisible-on-success) extraction phase. Confirmed against the
        # real dance's decompiled source: for extraction, BOTH
        # buildstamp AND the Dockerfile go into the scratch dir, and the
        # scratch dir itself is the build context (unlike inject, where
        # buildstamp/context is the cache dir, Dockerfile is in scratch --
        # the two phases are asymmetric). My first hand-rolled attempt of
        # this step never wrote scratch/buildstamp at all -- it would
        # have hit the exact same "/buildstamp": not found error the
        # inject step (also fixed in this same commit) hit, except this
        # step's failure never got the chance to run since the job failed
        # earlier at inject first.
        #
        # Then: build the Dancefile.extract image with --load (imports it
        # into the HOST docker daemon, not just the buildx builder), then
        # docker create + docker cp (not the piped tar approach the real
        # dance uses, to sidestep any tar/pipe-specific edge case) to pull
        # /var/dance-cache onto the runner's local disk. Every step logs
        # its own output/counts so a truncation or empty-directory bug is
        # visible directly in this job's log instead of only showing up
        # as a mysteriously tiny actions/cache save afterward.


  cache-benchmark-warm-cachemount:
    if: false  # TEMPORARY: disabled while iterating on new k3s-focused cache-mount jobs below -- re-enable when resuming this comparison
    needs: cache-benchmark-cold-cachemount
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,extras=s3-cache,disk=large,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
      k3s-build-seconds: ${{ steps.timed-build-k3s.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Same GC policy override as cache-benchmark-cold-cachemount --
          # must match, otherwise this job's builder would evict the
          # injected cache back down to the default ~488MiB ceiling
          # before the timed build even runs.
          buildkitd-config-inline: |
            [worker.oci]
              [[worker.oci.gcpolicy]]
                keepDuration = "48h"
                filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
                maxUsedSpace = "12GB"
              [[worker.oci.gcpolicy]]
                all = true
                reservedSpace = "1GB"
      # Same key as cache-benchmark-cold-cachemount. Must hit -- that
      # job's dance-based save already committed by the time this job
      # starts (needs: cache-benchmark-cold-cachemount).
      - name: "Restore go build/mod cache (expected: hit)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache-benchmark-mount
          key: rancher-gocache-benchmark-mount-${{ github.run_id }}
      - name: "Report cache hit status (should be true)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Expected a cache hit on the warm job but got a miss -- Magic Cache / actions/cache restore did not work as expected."
            exit 1
          fi
          echo "Restored cache size:"
          du -sh go-build-cache-benchmark-mount || true
      - name: "Inject cache into BuildKit (debug: hand-rolled, verbose)"
        shell: bash
        run: |
          set -x
          mkdir -p scratch
          # buildstamp goes in the cache dir (build context), matching
          # the real dance action's inject-phase behavior and the fix
          # already applied to cache-benchmark-cold-cachemount's inject
          # step -- see the comment there for the full explanation.
          date -u -Iseconds > go-build-cache-benchmark-mount/buildstamp
          {
            echo 'FROM ghcr.io/containerd/busybox:latest'
            echo 'COPY buildstamp buildstamp'
            echo 'RUN --mount=type=cache,target=/root/.cache,id=rancher-cache-mount-bench \'
            echo '    --mount=type=bind,source=.,target=/var/dance-cache \'
            echo '    cp -p -R /var/dance-cache/. /root/.cache && echo INJECT_CP_OK || echo INJECT_CP_FAILED'
          } > scratch/Dancefile.inject
          echo "=== source dir being injected (should be the restored ~10GB cache) ==="
          du -sh go-build-cache-benchmark-mount || true
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            -f scratch/Dancefile.inject \
            --tag dance:inject \
            --progress=plain \
            --no-cache \
            go-build-cache-benchmark-mount 2>&1 | tee /tmp/inject-build.log
          echo "=== full inject build log ==="
          cat /tmp/inject-build.log
          echo "=== exec.cachemount storage right after inject ==="
          docker buildx du --verbose --builder "${{ steps.setup-buildx.outputs.name }}" 2>&1 | grep -B8 "exec.cachemount" || true
        # Read-only leg of the benchmark -- never writes back. Same
        # hand-rolled replacement as cache-benchmark-cold-cachemount's
        # inject step, for the same debugging reasons (silent vendored
        # action, need actual visibility into what's happening).

      - name: "Timed build (server-build-mount, warm cache mount)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target server-build-mount \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Warm (cache mount) build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Warm (cache mount, server-build-mount): ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"
      - name: "Timed build (images-mount / k3s, warm cache mount)"
        id: timed-build-k3s
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target k3s-images-mount \
            --output type=local,dest=k3s-images-mount-out \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Warm (cache mount, k3s) build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Warm (cache mount, images-mount / k3s): ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"
          ls -la k3s-images-mount-out/ || true
        # k3s-images-mount images-mount's cache mount (id=...-k3s) was
        # never injected/populated by the dance steps above (only the
        # server-build-mount id was) -- this run is therefore itself a
        # COLD run for the k3s leg specifically. Kept in for completeness/
        # symmetry with the bind-mount benchmark's k3s coverage, but its
        # number should be read as "k3s cold under the raised GC policy",
        # not "k3s warm".

  # ---------------------------------------------------------------------
  # END TEMPORARY cache-benchmark-*-cachemount block
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # TEMPORARY: cache-benchmark-{cold,warm}-bind -- same comparison as
  # cache-benchmark-{cold,warm} above, but exercising the bind-mount-based
  # stages in package/Dockerfile (rancher-go-builder-bind,
  # server-build-bind, images-bind) instead of the COPY-based ones.
  #
  # Bind mount writes are discarded when the RUN instruction ends (see
  # comment above rancher-go-builder-bind in package/Dockerfile), so
  # there's no way to produce a populated cache FROM a bind-mount build --
  # cache-benchmark-cold-bind still produces its cache via the existing
  # COPY-based server-build + gocache-out mechanism (same as
  # cache-benchmark-cold), it just ALSO times a bind-mount build against
  # an empty gocache-in for the "cold, bind mount" comparison number.
  # cache-benchmark-warm-bind then restores that same COPY-produced cache
  # and feeds it into the bind-mount stages via --build-context, to see
  # whether reading via bind mount (no upfront COPY-materialization into
  # /root/.cache, and none of that ~10GB ends up in a committed image
  # layer) beats the COPY-based warm build.
  #
  # Also covers the k3s "images" step (images-bind target), per request --
  # the earlier cache-benchmark-{cold,warm} jobs only covered server-build.
  # ---------------------------------------------------------------------
  cache-benchmark-cold-bind:
    if: false  # TEMPORARY: disabled while iterating on new k3s-focused cache-mount jobs below -- re-enable when resuming this comparison
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,extras=s3-cache,disk=large,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Same scratch-key pattern as cache-benchmark-cold, but a distinct
      # key (suffixed -bind) so the two variants' actions/cache entries
      # never collide even though they run in the same workflow run.
      - name: "Restore go build/mod cache (expected: miss)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache-benchmark-bind
          key: rancher-gocache-benchmark-bind-${{ github.run_id }}
      - name: "Report cache hit status (should be false)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "::warning::Expected a cache miss on the cold job but got a hit -- scratch key collided, results are not trustworthy."
          fi
          mkdir -p go-build-cache-benchmark-bind
      - name: "Timed build (server-build-bind, cold/empty gocache-in)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --build-arg "GOCACHE_IN=gocache" \
            --build-context "gocache=go-build-cache-benchmark-bind" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target server-build-bind \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Cold (bind mount) build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Cold (bind mount, server-build-bind): ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"
        # No --output: server-build-bind isn't meant to produce a usable
        # image (its cache content is discarded, per the nature of bind
        # mounts) -- we only care about timing the RUN steps themselves.
        # Without --output/--load/--push, buildx runs the build and just
        # discards the result (prints a warning, exits 0) instead of
        # paying for an unused docker/tar export.
      - name: Populate cache for warm-bind job (COPY-based, reusing existing mechanism)
        shell: bash
        run: |
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target gocache-out \
            --output type=tar,dest=go-build-cache-benchmark-bind.tar \
            .
          rm -rf go-build-cache-benchmark-bind
          mkdir -p go-build-cache-benchmark-bind
          tar -xf go-build-cache-benchmark-bind.tar -C go-build-cache-benchmark-bind
          rm -f go-build-cache-benchmark-bind.tar
        # This is the SAME COPY-based gocache-out mechanism used by
        # cache-benchmark-cold's "Extract populated go build/mod cache"
        # step -- bind mounts have no equivalent extraction path (see
        # rancher-go-builder-bind comment in package/Dockerfile), so this
        # is the only way to obtain a populated cache to feed into
        # cache-benchmark-warm-bind. Note: this build shares no build-args
        # with the GOCACHE_IN-driven "Timed build" step above (it builds
        # plain server-build/gocache-out, not server-build-bind), so it is
        # NOT the near-instant cache-hit extraction cache-benchmark-cold
        # gets -- expect this to pay the full cold build + ~7min
        # extraction cost again here. Timing intentionally not measured/
        # reported for this step since it's not part of what we're trying
        # to compare (it's just how we generate warm-bind's input).

  cache-benchmark-warm-bind:
    if: false  # TEMPORARY: disabled while iterating on new k3s-focused cache-mount jobs below -- re-enable when resuming this comparison
    needs: cache-benchmark-cold-bind
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,extras=s3-cache,disk=large,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
      k3s-build-seconds: ${{ steps.timed-build-k3s.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: "Restore go build/mod cache (expected: hit)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache-benchmark-bind
          key: rancher-gocache-benchmark-bind-${{ github.run_id }}
      - name: "Report cache hit status (should be true)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Expected a cache hit on the warm job but got a miss -- Magic Cache / actions/cache restore did not work as expected."
            exit 1
          fi
          echo "Restored cache size:"
          du -sh go-build-cache-benchmark-bind || true
      - name: "Timed build (server-build-bind, warm gocache-in via bind mount)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --build-arg "GOCACHE_IN=gocache" \
            --build-context "gocache=go-build-cache-benchmark-bind" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target server-build-bind \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Warm (bind mount) build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Warm (bind mount, server-build-bind): ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"
      - name: "Timed build (images-bind / k3s, warm gocache-in via bind mount)"
        id: timed-build-k3s
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "GOCACHE_IN=gocache" \
            --build-context "gocache=go-build-cache-benchmark-bind" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target k3s-images-bind \
            --output type=local,dest=k3s-images-bind-out \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Warm (bind mount, k3s) build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Warm (bind mount, images-bind / k3s): ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"
          ls -la k3s-images-bind-out/ || true
        # k3s-images-bind (not images-bind directly) since images-bind
        # itself has no output-able artifact of its own -- k3s-images-bind
        # is a tiny scratch stage that COPYs the resulting k3s airgap tar
        # out, giving us both a real timing number AND a concrete,
        # checkable artifact confirming the build actually produced
        # something (rather than just running RUN steps with no output at
        # all, as done for server-build-bind above).
  # ---------------------------------------------------------------------
  # END TEMPORARY cache-benchmark-*-bind block
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # TEMPORARY: cache-mount benchmark using buildkit-cache-dance@v2.1.4
  # (vendored in .github/actions/buildkit-cache-dance-v2/), testing the
  # workaround suggested by multiple independent reports in the still-open
  # upstream issue reproducible-containers/buildkit-cache-dance#33 ("Stored
  # cache is empty") -- see .github/actions/buildkit-cache-dance-v2/VENDORED.md
  # for full context. Uses the ACTUAL vendored action here (not a hand-rolled
  # reimplementation like cache-benchmark-cold/warm-cachemount above) since
  # the whole point is testing whether v2.1.4's own real implementation
  # avoids the empty-extraction bug our v3.4.0-based hand-rolled attempts
  # hit twice.
  # ---------------------------------------------------------------------
  cache-benchmark-cold-cachemount-dance-v2:
    if: false  # TEMPORARY: disabled while iterating on new k3s-focused cache-mount jobs below -- re-enable when resuming this comparison
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,extras=s3-cache,disk=large,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Same raised GC policy as the v3.4.0 cachemount benchmark --
          # v2.1.4's cache mount (id defaults to the target path,
          # /root/.cache-dance-v2) needs the same headroom.
          buildkitd-config-inline: |
            [worker.oci]
              [[worker.oci.gcpolicy]]
                keepDuration = "48h"
                filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
                maxUsedSpace = "12GB"
              [[worker.oci.gcpolicy]]
                all = true
                reservedSpace = "1GB"
      - name: "Restore go build/mod cache (expected: miss)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache-benchmark-dance-v2
          key: rancher-gocache-benchmark-dance-v2-${{ github.run_id }}
      - name: "Report cache hit status (should be false)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "::warning::Expected a cache miss on the cold job but got a hit -- scratch key collided, results are not trustworthy."
          fi
      - name: "Inject (likely empty) cache into BuildKit via buildkit-cache-dance@v2.1.4"
        uses: ./.github/actions/buildkit-cache-dance-v2
        with:
          cache-source: go-build-cache-benchmark-dance-v2
          cache-target: /root/.cache
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}
        # cache-target must match GOMODCACHE/GOCACHE (both under
        # /root/.cache, set in go-builder) -- an earlier version of this
        # job used /root/.cache-dance-v2, which go mod download/go build
        # never actually write into, silently making the whole benchmark
        # measure nothing. Fixed before the (already-running, since-killed)
        # first attempt's results were used.
        # No `builder:` input -- v2.1.4's action.yml doesn't define one (it
        # always runs `docker buildx build` against the default builder,
        # unlike v3.4.0 which supports passing --builder explicitly).
        # docker/setup-buildx-action already makes the builder it creates
        # the active/default one, so this doesn't need one.
      - name: "Timed build (server-build-mount-dance-v2, cold cache mount)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target server-build-mount-dance-v2 \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Cold (cache mount, dance v2.1.4) build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Cold (cache mount, dance v2.1.4, server-build-mount-dance-v2): ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"
      - name: "Report exec.cachemount storage held by BuildKit"
        shell: bash
        run: |
          docker buildx du --verbose --builder "${{ steps.setup-buildx.outputs.name }}" || true
        # No manual "extraction" or "check extracted dir size" step here,
        # unlike the v3.4.0 hand-rolled jobs above: v2.1.4's extraction
        # (like v3.x) only runs via the inject step's automatic post-hook,
        # which fires at job cleanup time -- AFTER all of this job's own
        # steps have already run. Any step placed here would just be
        # checking pre-extraction (still-cold) state. The real evidence for
        # whether this worked is in the job's own log at cleanup time (the
        # vendored action's `post` script runs with `set -eux`, so its own
        # `cp -p -R ... || true` is visible directly, unlike the silent
        # v3.4.0 action) and in the final `actions/cache` save size
        # reported by the "Post Restore go build/mod cache" step.

  # ---------------------------------------------------------------------
  # END TEMPORARY cache-benchmark-cold-cachemount-dance-v2 block
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # TEMPORARY: cache-benchmark-{cold,warm}-gocacheprog -- evaluates Go
  # 1.24+'s GOCACHEPROG protocol as an alternative to (or complement of)
  # everything above, per Tom's ask and GOCACHEPROG_FINDINGS.md.
