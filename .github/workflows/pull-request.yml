  # GOCACHEPROG bucket (from this job) and the existing GOMODCACHE
  # gocache-in cache (from cache-benchmark-cold, reused directly --
  # module deps haven't changed between these benchmark jobs in the same
  # workflow run) via --build-context, and times a build with a
  # populated GOCACHEPROG bucket but a FRESH/uninitialized local
  # gobuildcache staging dir (/tmp/gocacheprog-bucket contents ARE the
  # persisted state; there's no separate local disk cache to complicate
  # the cold/warm distinction with this backend, unlike a
  # server/socket-mode GOCACHEPROG deployment would have).
  # ---------------------------------------------------------------------
  cache-benchmark-cold-gocacheprog:
    if: false  # TEMPORARY: disabled while iterating on new k3s-focused cache-mount jobs below -- re-enable when resuming this comparison
