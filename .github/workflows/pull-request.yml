name: Build Pull Request
on:
  pull_request:
    paths-ignore:
      # omit tests from triggering CI except when CI tests are changed
      - "tests/v2/codecoverage/**"
      - "tests/validation/**"

permissions:
  contents: read
  id-token: none

env:
  ARCH: amd64
  TAG: v2.14-${{ github.sha }}-head
  GIT_TAG: v2.14-${{ github.sha }}-head
  HEAD_TAG: "head"
  COMMIT: ${{ github.sha }}
  REPOSITORY_OWNER: ${{ github.repository_owner }}
  IMAGE: ${{ github.repository_owner }}/rancher
  IMAGE_AGENT: ${{ github.repository_owner }}/rancher-agent
  IMAGE_INSTALLER: ${{ github.repository_owner }}/system-agent-installer-rancher
jobs:
  unit-tests:
    uses: ./.github/workflows/unit-test.yml
  build-chart:
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.26
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: setup and build
        uses: ./.github/actions/rancher-chart/build
  build-server:
    strategy:
      matrix:
        os: [linux]
        arch: [x64, arm64]
    runs-on: runs-on,runner=4cpu-${{ matrix.os }}-${{ matrix.arch }},image=ubuntu22-full-${{ matrix.arch }},extras=s3-cache,run-id=${{ github.run_id }}
    env:
      ARCH: ${{ matrix.arch }}
      OS: ${{ matrix.OS }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: setup and build
        uses: ./.github/actions/build-images/server
  build-agent:
    strategy:
      matrix:
        os: [linux]
        arch: [x64, arm64]
    runs-on: runs-on,runner=4cpu-${{ matrix.os }}-${{ matrix.arch }},image=ubuntu22-full-${{ matrix.arch }},extras=s3-cache,run-id=${{ github.run_id }}
    env:
      ARCH: ${{ matrix.arch }}
      OS: ${{ matrix.OS }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: setup and build
        uses: ./.github/actions/build-images/agent
  build-installer:
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,run-id=${{ github.run_id }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Verify installer Dockerfile build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./package/Dockerfile.installer
          build-args: |
            BUILDARCH=amd64
            VERSION=0.0.0
          platforms: linux/amd64
          load: false
          push: false
          cache-from: type=gha,scope=pr-build-installer
          cache-to: type=gha,mode=min,scope=pr-build-installer

  # ---------------------------------------------------------------------
  # TEMPORARY: cache-benchmark-{cold,warm} -- proves out a go build/mod
  # cache persisted via a plain COPY from an extra buildx build-context
  # (package/Dockerfile's GOCACHE_IN arg / gocache-in, gocache-out stages)
  # instead of RUN --mount=type=cache, using this real PR's pull_request
  # trigger (since workflow_dispatch isn't reachable from a non-default-
  # branch workflow file). Not wired into any real build path
  # (build-server/build-agent are untouched by these two jobs) -- safe to
  # drop once the benchmark numbers are in hand. Remove this whole block,
  # and the TEMPORARY-marked additions in package/Dockerfile, before
  # merging the caching change for real.
  #
  # Why not RUN --mount=type=cache (see earlier attempt in this PR's
  # history): this runner fleet's BuildKit daemon caps exec.cachemount
  # (the storage class RUN --mount=type=cache lives in) GC budget at
  # ~488MiB, far below the ~10GB go build/mod cache this repo needs --
  # BuildKit silently evicted almost all of it before it could be
  # extracted. A plain COPY into a normal image layer instead falls under
  # BuildKit's much larger regular-layer GC budget (~90GB on this fleet),
  # sidestepping that ceiling entirely.
  #
  # cache-benchmark-cold builds server with an empty (scratch) gocache-in
  # context against a scratch actions/cache key that is unique per
  # workflow run (so every push to this PR branch re-runs a genuine cold
  # start), times the build, then does a second (near-instant, since the
  # builder + layers are already warm) buildx invocation targeting
  # gocache-out to extract the now-populated /root/.cache directory back
  # onto the runner's disk, and always saves it via actions/cache.
  #
  # cache-benchmark-warm needs: cache-benchmark-cold (so the save has
  # already committed by the time this job starts), restores the SAME
  # scratch key -- this must hit -- passes the restored directory in as
  # the gocache-in build-context, builds again, and never writes back.
  # Fails loudly if the expected hit doesn't happen so a bad number can't
  # sneak through silently.
  # ---------------------------------------------------------------------
  cache-benchmark-cold:
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,extras=s3-cache,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Unique per workflow run -- guaranteed to not exist yet, so this is a
      # genuine cold start every time the PR branch is pushed.
      - name: "Restore go build/mod cache (expected: miss)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache-benchmark
          key: rancher-gocache-benchmark-${{ github.run_id }}
      - name: "Report cache hit status (should be false)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "::warning::Expected a cache miss on the cold job but got a hit -- scratch key collided, results are not trustworthy."
          fi
          mkdir -p go-build-cache-benchmark
      - name: "Timed build (server, cold/empty gocache-in)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --build-arg "GOCACHE_IN=gocache" \
            --build-context "gocache=go-build-cache-benchmark" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target server \
            --output type=docker,dest=/tmp/rancher-cache-benchmark-cold.tar \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Cold build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Cold build: ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Extract populated go build/mod cache
        shell: bash
        run: |
          rm -rf go-build-cache-benchmark
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target gocache-out \
            --output type=local,dest=go-build-cache-benchmark \
            .
        # gocache-out (FROM scratch; COPY --from=server-build /root/.cache /)
        # only depends on the server-build stage, not on gocache-in, so no
        # GOCACHE_IN / --build-context is needed here -- BuildKit only
        # evaluates stages that are actual dependencies of --target.
        # server-build's layers are already warm from the previous step's
        # build in this same job, so this invocation should be seconds,
        # not minutes.

  cache-benchmark-warm:
    needs: cache-benchmark-cold
    runs-on: runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,extras=s3-cache,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Same scratch key as cache-benchmark-cold. Must hit -- that job's
      # save step already committed by the time this job starts
      # (needs: cache-benchmark-cold).
      - name: "Restore go build/mod cache (expected: hit)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache-benchmark
          key: rancher-gocache-benchmark-${{ github.run_id }}
      - name: "Report cache hit status (should be true)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Expected a cache hit on the warm job but got a miss -- Magic Cache / actions/cache restore did not work as expected."
            exit 1
          fi
          echo "Restored cache size:"
          du -sh go-build-cache-benchmark || true
      - name: "Timed build (server, warm gocache-in)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=amd64" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --build-arg "GOCACHE_IN=gocache" \
            --build-context "gocache=go-build-cache-benchmark" \
            --platform linux/amd64 \
            --file ./package/Dockerfile \
            --target server \
            --output type=docker,dest=/tmp/rancher-cache-benchmark-warm.tar \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Warm build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Warm build: ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"

  cache-benchmark-report:
    needs: [cache-benchmark-cold, cache-benchmark-warm]
    runs-on: runs-on,runner=1cpu-linux-x64,image=ubuntu22-full-x64,run-id=${{ github.run_id }}
    steps:
      - name: Summarize results
        run: |
          COLD="${{ needs.cache-benchmark-cold.outputs.build-seconds }}"
          WARM="${{ needs.cache-benchmark-warm.outputs.build-seconds }}"
          echo "# Cache Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | Build time |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cold (empty gocache-in) | ${COLD}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Warm (gocache-in restored via COPY + actions/cache) | ${WARM}s |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$COLD" ] && [ -n "$WARM" ] && [ "$WARM" -gt 0 ]; then
            SPEEDUP=$(awk "BEGIN { printf \"%.1f\", $COLD / $WARM }")
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Speedup: **${SPEEDUP}x**" >> "$GITHUB_STEP_SUMMARY"
          fi
  # ---------------------------------------------------------------------
  # END TEMPORARY cache-benchmark block
  # ---------------------------------------------------------------------

  integration-tests:
    permissions:
      contents: read
    needs: [build-server, build-agent]
    uses: ./.github/workflows/integration-tests.yml
  provisioning-tests:
    permissions:
      contents: read
    needs: [build-server, build-agent]
    uses: ./.github/workflows/provisioning-tests.yml
