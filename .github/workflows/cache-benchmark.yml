name: Cache Benchmark (buildkit-cache-dance)

# Manual-only workflow to benchmark cold vs warm go build/mod cache restore
# using reproducible-containers/buildkit-cache-dance against RunsOn's Magic
# Cache (S3-backed actions/cache, extras=s3-cache).
#
# Usage: trigger via workflow_dispatch. It always writes to a scratch cache
# key suffixed with the run id, so every dispatch starts genuinely cold and
# doesn't collide with real PR-cache keys once this lands in pull-request.yml.
#
# Job graph:
#   cache-cold  -> builds rancher-server with an empty cache mount, times it,
#                  extracts + saves the populated go build/mod cache to the
#                  scratch key via actions/cache (S3-backed via Magic Cache).
#   cache-warm  -> needs: cache-cold (so the save from the previous job has
#                  committed), restores the SAME scratch key, injects it into
#                  BuildKit, builds again, times it. skip-extraction: true
#                  since this run should never write back.
#
# Compare the two "build duration" step summaries to get a real
# cold-vs-warm number for this exact cache mechanism before it goes into
# pull-request.yml for real.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to build for (x64 or arm64)"
        required: false
        default: "x64"

env:
  ARCH: amd64
  TAG: v2.14-${{ github.sha }}-head
  GIT_TAG: v2.14-${{ github.sha }}-head
  HEAD_TAG: "head"
  COMMIT: ${{ github.sha }}
  REPOSITORY_OWNER: ${{ github.repository_owner }}
  IMAGE: ${{ github.repository_owner }}/rancher
  # Scratch key: unique per workflow run, so every manual dispatch is a real
  # cold start and never collides with a previous benchmark run's cache.
  SCRATCH_CACHE_KEY: rancher-gocache-benchmark-${{ github.run_id }}

jobs:
  cache-cold:
    runs-on: runs-on,runner=4cpu-linux-${{ inputs.arch }},image=ubuntu22-full-${{ inputs.arch }},extras=s3-cache,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Arch environment variable
        shell: bash
        run: |
          if [[ "${{ inputs.arch }}" == "x64" ]]; then
            echo "ARCH=amd64" >> "$GITHUB_ENV"
          fi

      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # This should always miss -- key is unique to this run and the cache
      # cannot exist yet. That's the point: it proves "cold" is really cold.
      - name: "Restore go build/mod cache (expected: miss)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache
          key: ${{ env.SCRATCH_CACHE_KEY }}

      - name: "Report cache hit status (should be false)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "::warning::Expected a cache miss on the cold job but got a hit -- scratch key collided, results are not trustworthy."
          fi

      - name: Inject (empty) cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "go-build-cache": { "target": "/root/.cache", "id": "rancher" }
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: "Timed build (server, cold cache)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=${{ env.ARCH }}" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --platform "linux/${{ env.ARCH }}" \
            --file ./package/Dockerfile \
            --target server \
            --output type=docker,dest=/tmp/rancher-cold.tar \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Cold build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Cold build: ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"

      # Extraction happens automatically as a post-step of the
      # buildkit-cache-dance action above (it runs on 'post' by default),
      # writing the populated /root/.cache content back into
      # go-build-cache/, which actions/cache then saves under
      # SCRATCH_CACHE_KEY at the end of this job.

  cache-warm:
    needs: cache-cold
    runs-on: runs-on,runner=4cpu-linux-${{ inputs.arch }},image=ubuntu22-full-${{ inputs.arch }},extras=s3-cache,run-id=${{ github.run_id }}
    permissions:
      contents: read
    outputs:
      build-seconds: ${{ steps.timed-build.outputs.seconds }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Arch environment variable
        shell: bash
        run: |
          if [[ "${{ inputs.arch }}" == "x64" ]]; then
            echo "ARCH=amd64" >> "$GITHUB_ENV"
          fi

      - name: Setup Dependencies Env Variables
        id: env
        uses: ./.github/actions/setup-build-env

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Same scratch key as cache-cold. This MUST hit -- cache-cold's save
      # step already committed by the time this job starts (needs: cache-cold).
      - name: "Restore go build/mod cache (expected: hit)"
        id: cache
        uses: actions/cache@v4
        with:
          path: go-build-cache
          key: ${{ env.SCRATCH_CACHE_KEY }}

      - name: "Report cache hit status (should be true)"
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Expected a cache hit on the warm job but got a miss -- Magic Cache / actions/cache restore did not work as expected."
            exit 1
          fi

      - name: Inject cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "go-build-cache": { "target": "/root/.cache", "id": "rancher" }
            }
          # This is the read-only leg of the benchmark: never write the
          # cache back from here, only cache-cold's job is allowed to save.
          skip-extraction: true

      - name: "Timed build (server, warm cache)"
        id: timed-build
        shell: bash
        run: |
          START=$(date +%s)
          docker buildx build \
            --builder "${{ steps.setup-buildx.outputs.name }}" \
            --build-arg "VERSION=${{ env.TAG }}" \
            --build-arg "COMMIT=${{ env.COMMIT }}" \
            --build-arg "ARCH=${{ env.ARCH }}" \
            --build-arg "CATTLE_RANCHER_WEBHOOK_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_WEBHOOK_VERSION }}" \
            --build-arg "CATTLE_REMOTEDIALER_PROXY_VERSION=${{ steps.env.outputs.CATTLE_REMOTEDIALER_PROXY_VERSION }}" \
            --build-arg "CATTLE_RANCHER_TURTLES_VERSION=${{ steps.env.outputs.CATTLE_RANCHER_TURTLES_VERSION }}" \
            --build-arg "CATTLE_CSP_ADAPTER_MIN_VERSION=${{ steps.env.outputs.CATTLE_CSP_ADAPTER_MIN_VERSION }}" \
            --build-arg "CATTLE_FLEET_VERSION=${{ steps.env.outputs.CATTLE_FLEET_VERSION }}" \
            --platform "linux/${{ env.ARCH }}" \
            --file ./package/Dockerfile \
            --target server \
            --output type=docker,dest=/tmp/rancher-warm.tar \
            .
          END=$(date +%s)
          SECONDS_TAKEN=$((END - START))
          echo "Warm build took ${SECONDS_TAKEN}s"
          echo "seconds=${SECONDS_TAKEN}" >> "$GITHUB_OUTPUT"
          echo "### Warm build: ${SECONDS_TAKEN}s" >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [cache-cold, cache-warm]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize results
        run: |
          COLD="${{ needs.cache-cold.outputs.build-seconds }}"
          WARM="${{ needs.cache-warm.outputs.build-seconds }}"
          echo "# Cache Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | Build time |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cold (empty cache mount) | ${COLD}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Warm (restored via buildkit-cache-dance + actions/cache) | ${WARM}s |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$COLD" ] && [ -n "$WARM" ] && [ "$WARM" -gt 0 ]; then
            SPEEDUP=$(awk "BEGIN { printf \"%.1f\", $COLD / $WARM }")
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Speedup: **${SPEEDUP}x**" >> "$GITHUB_STEP_SUMMARY"
          fi
