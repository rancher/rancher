name: Smoke Test
on:
  workflow_call:
env:
  TAG: v2.16-${{ github.sha }}-head
  GIT_TAG: v2.16-${{ github.sha }}-head
  ARCH: amd64
  IMAGE: ${{ github.repository_owner }}/rancher
permissions: {}
jobs:
  # Installs the built image with the built chart, without CATTLE_DEV_MODE,
  # unlike integration/provisioning tests. This exercises production-only code
  # paths such as the driver jail (package/jailer.sh).
  smoke-test:
    runs-on:
      - runs-on
      - spot=false
      - runner=8cpu-linux-x64
      - run-id=${{ github.run_id }}
    timeout-minutes: 30
    env:
      K3D_VERSION: v5.9.0
      K3D_BIN_HASH_AMD64: "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0"
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download server image and chart artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{rancher-linux-amd64,rancher-chart}"
          path: "/tmp"
          merge-multiple: true
      - name: Load server image
        run: |
          image_server_id=$(docker load --input /tmp/rancher-linux-amd64.tar 2>&1 | grep "Loaded image" | awk '{print $NF}')
          if [ -z "$image_server_id" ]; then
            echo "Error: Failed to load image from tarball!"
            exit 1
          fi
          docker tag "$image_server_id" "${IMAGE}:${TAG}"
      - name: Install k3d
        run: |
          curl -sSfL -o k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-${ARCH}"
          echo "${K3D_BIN_HASH_AMD64}  k3d" | shasum -a 256 --check
          sudo mv k3d /usr/local/bin
          sudo chmod +x /usr/local/bin/k3d
      - name: Run smoke test
        env:
          RANCHER_CHART: /tmp/rancher-chart.tgz
        run: IMAGE="${IMAGE}:${TAG}" ./.github/scripts/smoke-test.sh
