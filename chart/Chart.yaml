apiVersion: v2
name: rancher
description: Install Rancher Server to manage Kubernetes clusters across providers.
version: 0.0.0-VERSION
appVersion: "%APP_VERSION%"
kubeVersion: < 1.38.0-0
home: https://rancher.com
icon: https://raw.githubusercontent.com/rancher/ui/master/public/assets/images/logos/welcome-cow.svg
keywords:
  - rancher
sources:
  - https://github.com/rancher/rancher
maintainers:
  - name: Rancher Labs
    email: charts@rancher.com
annotations:
  # Images used by the files of this chart, see HIP-0015. Generated from build.yaml
  # by go generate; %APP_VERSION% is replaced by the chart build.
  helm.sh/images: |
    - name: rancher
      image: rancher/rancher:%APP_VERSION%
    - name: rancher-assets
      image: rancher/rancher-assets:v2.16-20261113T2059Z-dev
    - name: shell
      image: rancher/shell:v0.9.1-rc.2
    - name: mirrored-bci-micro
      image: rancher/mirrored-bci-micro:16.0-15.11
    - name: kube-api-auth
      image: rancher/kube-api-auth:v0.16.0-rc.5
    - name: rancher-agent
      image: rancher/rancher-agent:%APP_VERSION%
    - name: system-agent
      image: rancher/system-agent:v0.16.0-rc.9
    - name: wins
      image: rancher/wins:v0.16.0-rc.10
      os: windows
    - name: machine
      image: rancher/machine:v0.15.0-rancher146-rc.10
